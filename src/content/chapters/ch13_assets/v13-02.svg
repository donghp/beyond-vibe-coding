<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .border { stroke: #E2E8F0; stroke-width: 1.5; }
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #0B1D3A; letter-spacing: 0.05em; text-transform: uppercase; }
      .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748B; letter-spacing: 0.08em; text-transform: uppercase; }
      .node-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #0B1D3A; }
      .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 500; fill: #64748B; }
      .connector { stroke: #0EA5E9; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .solid-conn { stroke: #0B1D3A; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0EA5E9" />
    </marker>
  </defs>

  <!-- Canvas Surface -->
  <rect width="100%" height="100%" class="bg" rx="6" />
  <rect x="1" y="1" width="718" height="318" fill="none" class="border" rx="5" />

  <!-- Top: Method & Project Governance -->
  <g transform="translate(200, 25)">
    <rect width="320" height="54" rx="4" fill="#FFFFFF" stroke="#0B1D3A" stroke-width="2" />
    <text x="160" y="24" text-anchor="middle" class="title">BVC ENGINEERING METHOD</text>
    <text x="160" y="42" text-anchor="middle" class="subtitle">Single Source of Architecture &amp; Contracts</text>
  </g>

  <!-- Connectors from Top to Middle -->
  <line x1="280" y1="79" x2="160" y2="125" class="connector" marker-end="url(#arrow)" />
  <line x1="360" y1="79" x2="360" y2="125" class="connector" marker-end="url(#arrow)" />
  <line x1="440" y1="79" x2="560" y2="125" class="connector" marker-end="url(#arrow)" />

  <!-- Middle: Multiple Executors (A, B, C) -->
  <g transform="translate(70, 130)">
    <rect width="180" height="64" rx="4" fill="#F0F7FF" stroke="#0EA5E9" stroke-width="1.5" />
    <rect x="10" y="10" width="8" height="8" rx="2" fill="#0EA5E9" />
    <text x="26" y="18" class="node-text">EXECUTOR A</text>
    <text x="26" y="34" class="node-desc">Specialized AI Reasoner</text>
    <text x="26" y="48" class="node-desc" fill="#0EA5E9">Task Decomposition</text>
  </g>

  <g transform="translate(270, 130)">
    <rect width="180" height="64" rx="4" fill="#F0F7FF" stroke="#0EA5E9" stroke-width="1.5" />
    <rect x="10" y="10" width="8" height="8" rx="2" fill="#0EA5E9" />
    <text x="26" y="18" class="node-text">EXECUTOR B</text>
    <text x="26" y="34" class="node-desc">Rapid Synthesis Agent</text>
    <text x="26" y="48" class="node-desc" fill="#0EA5E9">Deterministic Code Write</text>
  </g>

  <g transform="translate(470, 130)">
    <rect width="180" height="64" rx="4" fill="#F0F7FF" stroke="#0EA5E9" stroke-width="1.5" />
    <rect x="10" y="10" width="8" height="8" rx="2" fill="#0EA5E9" />
    <text x="26" y="18" class="node-text">EXECUTOR C</text>
    <text x="26" y="34" class="node-desc">Auditor &amp; Verifier</text>
    <text x="26" y="48" class="node-desc" fill="#0EA5E9">Test Verification</text>
  </g>

  <!-- Connectors from Middle to Bottom -->
  <line x1="160" y1="194" x2="280" y2="238" class="connector" marker-end="url(#arrow)" />
  <line x1="360" y1="194" x2="360" y2="238" class="connector" marker-end="url(#arrow)" />
  <line x1="560" y1="194" x2="440" y2="238" class="connector" marker-end="url(#arrow)" />

  <!-- Bottom: Unified Project -->
  <g transform="translate(180, 242)">
    <rect width="360" height="56" rx="4" fill="#E8F8F0" stroke="#22C55E" stroke-width="1.5" />
    <circle cx="28" cy="28" r="8" fill="#22C55E" />
    <path d="M 24 28 L 27 31 L 33 24" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <text x="48" y="26" class="node-text" fill="#0B1D3A">ONE CONTINUOUS PROJECT</text>
    <text x="48" y="42" class="node-desc" fill="#15803D">Executor changes dynamically • Project State is never lost</text>
  </g>
</svg>
