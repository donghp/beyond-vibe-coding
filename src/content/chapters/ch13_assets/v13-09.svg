<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .border { stroke: #E2E8F0; stroke-width: 1.5; }
      .head { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 800; fill: #0B1D3A; letter-spacing: 0.08em; text-transform: uppercase; }
      .cell { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0B1D3A; }
      .subcell { font-family: 'Inter', system-ui, sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748B; }
      .tag { font-family: 'Inter', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12" />
  <rect x="1" y="1" width="758" height="308" fill="none" class="border" rx="11" />

  <!-- Table Header -->
  <g transform="translate(24, 20)">
    <rect width="712" height="36" rx="6" fill="#F0F7FF" stroke="#E2E8F0" />
    <text x="20" y="22" class="head">TASK ARCHETYPE</text>
    <text x="180" y="22" class="head">CORE CAPABILITY REQUIRED</text>
    <text x="440" y="22" class="head">EXECUTOR PROFILE</text>
    <text x="580" y="22" class="head">VERIFICATION GATE</text>
  </g>

  <!-- Row 1: System Decomposition -->
  <g transform="translate(24, 68)">
    <rect width="712" height="52" rx="6" fill="#FFFFFF" stroke="#F1F5F9" />
    <text x="20" y="24" class="cell">System Decomposition</text>
    <text x="20" y="40" class="subcell">Architecture planning &amp; scope</text>
    <text x="180" y="24" class="cell">Long-horizon reasoning &amp; abstraction</text>
    <text x="180" y="40" class="subcell">Strict schema &amp; invariant preservation</text>
    <rect x="440" y="14" width="110" height="24" rx="4" fill="#F0F7FF" stroke="#0EA5E9" />
    <text x="495" y="30" text-anchor="middle" class="tag" fill="#0284C7">Deep Reasoner</text>
    <text x="580" y="31" class="subcell" fill="#15803D">Contract Audit</text>
  </g>

  <!-- Row 2: Code Synthesis -->
  <g transform="translate(24, 126)">
    <rect width="712" height="52" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="20" y="24" class="cell">Surgical Code Edit</text>
    <text x="20" y="40" class="subcell">Scoped single-file edits</text>
    <text x="180" y="24" class="cell">High syntactic accuracy &amp; diffing</text>
    <text x="180" y="40" class="subcell">Low hallucination rate &amp; typing</text>
    <rect x="440" y="14" width="110" height="24" rx="4" fill="#F3F6F9" stroke="#94A3B8" />
    <text x="495" y="30" text-anchor="middle" class="tag" fill="#334155">Fast Synthesizer</text>
    <text x="580" y="31" class="subcell" fill="#15803D">Unit Tests / AST</text>
  </g>

  <!-- Row 3: Repo Navigation -->
  <g transform="translate(24, 184)">
    <rect width="712" height="52" rx="6" fill="#FFFFFF" stroke="#F1F5F9" />
    <text x="20" y="24" class="cell">Repository Exploration</text>
    <text x="20" y="40" class="subcell">Symbol tracing &amp; discovery</text>
    <text x="180" y="24" class="cell">Large context indexing &amp; grep search</text>
    <text x="180" y="40" class="subcell">High tool-use fidelity</text>
    <rect x="440" y="14" width="110" height="24" rx="4" fill="#E8F8F0" stroke="#22C55E" />
    <text x="495" y="30" text-anchor="middle" class="tag" fill="#15803D">Index Agent</text>
    <text x="580" y="31" class="subcell" fill="#15803D">Reference Check</text>
  </g>

  <!-- Row 4: Security & Verification -->
  <g transform="translate(24, 242)">
    <rect width="712" height="52" rx="6" fill="#F8FAFC" stroke="#F1F5F9" />
    <text x="20" y="24" class="cell">Regression Audit</text>
    <text x="20" y="40" class="subcell">End-to-end correctness</text>
    <text x="180" y="24" class="cell">Adversarial edge-case discovery</text>
    <text x="180" y="40" class="subcell">Contract invariant enforcement</text>
    <rect x="440" y="14" width="110" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" />
    <text x="495" y="30" text-anchor="middle" class="tag" fill="#B91C1C">Verifier Engine</text>
    <text x="580" y="31" class="subcell" fill="#15803D">CI / Full Suite</text>
  </g>
</svg>
