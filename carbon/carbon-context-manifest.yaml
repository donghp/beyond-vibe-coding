manifest_version: "1.1.0"
product_name: "ENERIX Carbon"
product_type: "Regulatory-aware Carbon & GHG Emissions Engineering Platform"
as_of: "2026-09-16"
status: "CONTEXT_REHYDRATED_AND_RECONCILED"
runtime_mode: "repository-native / zero-backend demo"
demo_url: "https://donghp.github.io/beyond-vibe-coding/carbon/"

database_architecture:
  backend_database: false
  postgres: false
  supabase: false
  mongodb: false
  browser_persistence: "localStorage / IndexedDB"
  data_formats: ["Markdown", "YAML", "JSON", "JavaScript"]

authorities:
  legal: "Authoritative Vietnamese Laws, Decrees, Decisions, and Ministry Circulars"
  methodology: "Ministry MRV Circulars (MOIT 38/2023, MOC 13/2024, MARD 19/2024, MONRE 17/2022), TCVN ISO 14064-1/2/3:2025, GHG Protocol"
  calculation: "Deterministic Engine (JavaScript Execution Engine)"
  ai: "Advisory / Retrieval / Context Normalization only (non-authoritative for arithmetic or legal status)"

engineering_laws:
  - id: "LAW-001"
    name: "Legal Source is Not an AI Answer"
    description: "Authoritative legal sources must be backed by official legal documents, not AI text completions."
  - id: "LAW-002"
    name: "Formula is Not an Emission Factor"
    description: "Calculation formulas and emission factors are distinct domain entities with independent provenance."
  - id: "LAW-003"
    name: "Example is Not a Universal Factor"
    description: "Illustrative or default sample factors from literature must not be treated as legally binding default factors without explicit regulatory basis."
  - id: "LAW-004"
    name: "Current Law is Time-Dependent"
    description: "Legal applicability must evaluate temporal date bounds (effective_from, effective_to) rather than boolean flags."
  - id: "LAW-005"
    name: "Historical Calculations are Immutable Snapshots"
    description: "Completed calculation runs must record immutable snapshots of factors, rules, and parameters used."
  - id: "LAW-006"
    name: "AI is Advisory; Deterministic Engine is Authoritative"
    description: "AI assists discovery and interpretation; arithmetic execution is strictly handled by the deterministic calculation engine."
  - id: "LAW-007"
    name: "No Silent Substitution of Missing Values"
    description: "Missing activity data, factors, or parameters must cause validation failure or explicit warning, never silent default fallback."
  - id: "LAW-008"
    name: "No Hard-Coded Emission Factors or GWP Values"
    description: "All factors and GWP datasets must be loaded dynamically from versioned registry datasets."
  - id: "LAW-009"
    name: "Every Material Result Requires Provenance"
    description: "Every calculated emission value must trace to Activity Data -> Factor -> Methodology -> Regulatory Rule -> Source Document -> Evidence."
  - id: "LAW-010"
    name: "Regulatory Applicability Precedes Methodology Selection"
    description: "Legal obligation and sector applicability must be determined before resolving applicable technical methodologies."
  - id: "LAW-011"
    name: "Methodology Selection Precedes Calculation Execution"
    description: "A valid, verified methodology must be resolved and bound before executing numerical calculations."
  - id: "LAW-012"
    name: "Architecture Must Survive Database Migration"
    description: "Repository-native file models must strictly map to a relational database schema (PostgreSQL/Supabase) without code rewrite."
  - id: "LAW-013"
    name: "Sector-Adaptive Taxonomy Must Preserve Regulatory Mapping"
    description: "Sectors must map to official 6-sector regulatory taxonomy (Decision 42/2026/QĐ-TTg)."
  - id: "LAW-014"
    name: "Evidence & Source Document Traceability Required"
    description: "Calculations and activity inputs must link to verifiable physical or digital evidence artifacts."
  - id: "LAW-015"
    name: "Temporal Regulations Evaluated with Explicit Date Bounds"
    description: "Rule evaluation uses exact reporting period dates to prevent 'latest-wins' misclassifications during regulatory transitions."

regulatory_frameworks:
  - id: "LAW-72-2020-QH14"
    title: "Law on Environmental Protection 2020"
  - id: "DECREE-06-2022"
    title: "Decree 06/2022/NĐ-CP on GHG Emission Reduction and Ozone Layer Protection"
  - id: "DECREE-119-2025"
    title: "Decree 119/2025/NĐ-CP amending Decree 06/2022/NĐ-CP"
  - id: "DECREE-83-2026"
    title: "Decree 83/2026/NĐ-CP amending Decree 06/2022/NĐ-CP"
  - id: "DECISION-42-2026"
    title: "Decision 42/2026/QĐ-TTg updated list of mandatory GHG inventory facilities"
  - id: "DECISION-263-2026"
    title: "Decision 263/2026/QĐ-TTg allocation plan for GHG emission quotas"
  - id: "CIRCULAR-38-2023-MOIT"
    title: "Circular 38/2023/TT-BCT on GHG Inventory for Industry and Trade"
  - id: "CIRCULAR-13-2024-MOC"
    title: "Circular 13/2024/TT-BXD on GHG Inventory for Construction"
  - id: "CIRCULAR-19-2024-MARD"
    title: "Circular 19/2024/TT-BNNPTNT on GHG Inventory for Agriculture and Rural Development"
  - id: "CIRCULAR-17-2022-MONRE"
    title: "Circular 17/2022/TT-BTNMT on GHG Inventory and MRV Techniques"
  - id: "ISO-14064-2025"
    title: "TCVN ISO 14064-1/2/3:2025 Greenhouse Gases Standard"
  - id: "GHG-PROTOCOL"
    title: "GHG Protocol Corporate Accounting and Reporting Standard"

calculation_models:
  - id: "MODEL-01"
    name: "SIMPLE_FACTOR"
    formula: "E = AD * EF"
  - id: "MODEL-02"
    name: "FACTOR_WITH_CONVERSION"
    formula: "E = AD * EF * Conversion"
  - id: "MODEL-03"
    name: "MULTI_GAS"
    formula: "E_gas = AD * EF_gas; CO2e = Sum(E_gas * GWP_gas)"
  - id: "MODEL-04"
    name: "PARAMETERIZED"
    formula: "E = f(AD, parameters, EF_basis)"
  - id: "MODEL-05"
    name: "COMPOSITE"
    formula: "E_total = Sum(SubModel_i)"
  - id: "MODEL-06"
    name: "DYNAMIC"
    formula: "E_t = f(Stock_t, Decay_k, Rate_r)"
  - id: "MODEL-07"
    name: "PROJECT_REDUCTION"
    formula: "ER = Baseline_E - Project_E - Leakage_E"
  - id: "MODEL-08"
    name: "MASS_BALANCE"
    formula: "E = Mass_In - Mass_Out - Mass_Accumulated"
  - id: "MODEL-09"
    name: "MEASUREMENT_BASED"
    formula: "E = Concentration * FlowRate * OperatingHours"
  - id: "MODEL-10"
    name: "ENERGY_FLOW_CONVERSION"
    formula: "E = Volume * NetCalorificValue * CarbonContent * OxidationFactor * EF"

domain_entities:
  - "RegulatoryDocument"
  - "RegulatoryRule"
  - "Facility"
  - "ActivityData"
  - "EmissionFactor"
  - "GwpDataset"
  - "Methodology"
  - "CalculationModel"
  - "Evidence"
  - "CalculationRun"

governing_artifacts:
  - "carbon/knowledge/governance/ENERIX-CARBON-BASE-LOGIC-001.md"
  - "carbon/knowledge/governance/ENERIX-CARBON-GOVERNING-FRAMEWORK-001.md"
  - "carbon/knowledge/governance/ENERIX-CARBON-REGULATORY-REGISTRY-001.yaml"
  - "carbon/docs/architecture/EC-CONTEXT-001.md"
  - "carbon/docs/data-model/EC-DOMAIN-MODEL-001.yaml"
  - "carbon/docs/methodology/EC-CALCULATION-MODEL-CATALOG-001.yaml"
  - "carbon/docs/decisions/ADR-000-CONTEXT-REHYDRATION.md"
  - "carbon/docs/architecture/EC-IMPLEMENTATION-AUDIT-001.md"
  - "carbon/docs/architecture/EC-IMPLEMENTATION-STATUS-001.yaml"
