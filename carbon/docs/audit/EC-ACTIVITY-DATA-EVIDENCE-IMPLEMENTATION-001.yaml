entities:
  ActivityData:
    fields:
      - "activity_data_id"
      - "facility_id"
      - "calculation_plan_id"
      - "plan_step_id"
      - "activity_type"
      - "process_type"
      - "source_type"
      - "quantity"
      - "unit"
      - "activity_period"
      - "event_date"
      - "reporting_period"
      - "measurement_context"
      - "data_quality_state"
      - "validation_state"
      - "approval_state"
      - "provenance"
      - "evidence_refs"
      - "version"
      - "supersedes_id"
  Evidence:
    fields:
      - "evidence_id"
      - "evidence_type"
      - "title"
      - "source_ref"
      - "source_doc_id"
      - "coverage_period"
      - "facility_id"
      - "process_id"
      - "activity_data_id"
      - "provenance"
      - "evidence_state"
      - "validation_state"
      - "approval_state"
      - "version"
      - "supersedes_id"

lifecycle_states:
  ActivityData:
    - "DRAFT"
    - "SUBMITTED"
    - "UNDER_REVIEW"
    - "VALIDATED"
    - "APPROVED"
    - "REJECTED"
    - "SUPERSEDED"
  Evidence:
    - "EVIDENCE_REQUIRED"
    - "EVIDENCE_AVAILABLE"
    - "EVIDENCE_VALIDATED"
    - "EVIDENCE_APPROVED"

validation_gates:
  - name: "identity_valid"
    checks: "presence of unique activity_data_id"
  - name: "quantity_valid"
    checks: "presence, non-negative, numeric quantity"
  - name: "unit_compatibility"
    checks: "observed unit match against plan step expected unit"
  - name: "temporal_valid"
    checks: "containment within plan reporting period boundaries"
  - name: "provenance_complete"
    checks: "presence of source_ref and created_by"
  - name: "evidence_satisfied"
    checks: "presence of directly substantiated approved evidence references"

evidence_relationships:
  direct_substantiation: "ActivityData.evidence_refs includes Evidence.evidence_id OR Evidence.activity_data_id equals ActivityData.activity_data_id"
  administrative: "Evidence.facility_id matches ActivityData.facility_id but no direct substantiation references"

issue_propagation:
  - code: "ISSUE-TEMP-002"
    trigger: "Activity period straddles the mid-month circular effective date"
  - code: "ISSUE-RRM-001"
    trigger: "Overlapping activity periods with conflicting quantities or units"

