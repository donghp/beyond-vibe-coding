interval_semantics:
  lower_boundary: "inclusive"
  upper_boundary: "exclusive"
  boundary_representation: "[t_start, t_end)"
  open_ended_representation: "[t_start, null)"
  zero_length_behavior: "NOT_SPECIFIED"
  malformed_behavior: "FAIL_CLOSED"
  overlap_rule: "a_start < b_end AND b_start < a_end"
  adjacency_rule: "Contiguous points sharing boundary without overlapping"

interval_operations:
  - name: "contains"
    purpose: "Evaluate point-in-time containment"
    input: "EventDate, EffectivePeriod"
    output: "boolean"
  - name: "overlaps"
    purpose: "Evaluate interval overlaps via validity predicate"
    input: "EffectivePeriod, ReportingPeriod"
    output: "boolean"
  - name: "split"
    purpose: "Divide reporting/activity period by regulatory transition dates"
    input: "Interval, Date"
    output: "List of Intervals"
  - name: "sort"
    purpose: "Arrange boundaries/segments chronologically"
    input: "List of Intervals"
    output: "Ordered List of Intervals"

segmentation_rules:
  straddle_trigger: "Regulatory transition boundary strictly within Reporting/Activity period"
  mandatory_segmentation: true
  boundary_assignment: "Transition date belongs to successor segment (Segment B)"
  prohibited_zero_length_segments: true
  preserved_metadata:
    - "original_activity_id"
    - "split_reason"
    - "evaluated_rules_references"
  parent_period_preservation: true

transition_relationships:
  - name: "AMENDS"
    meaning: "Newer rule modifies sub-attributes of parent, keeping rule identity"
    historical_validity: "Preserved"
  - name: "REPLACES"
    meaning: "Newer rule completely overrides old rule at chronological boundary"
    historical_validity: "Preserved"
  - name: "SUPERSEDES"
    meaning: "Old rule declared legally void; lineage path preserved"
    historical_validity: "Preserved"
  - name: "APPLIES_DURING"
    meaning: "Transitional or grace periods map to matching activity windows"
    historical_validity: "Preserved"

