controlled_open_issues:
  - issue_id: "ISSUE-KM-001"
    title: "Missing Physical Text for Registered Legal Documents"
    description: "LAW-72-2020, DEC-06-2022, DEC-119-2025, DEC-83-2026, QD-42-2026 are registered in knowledge-manifest.yaml as pending-source."
    owning_artifact: "Document Repository"
    classification: "SOURCE_VERIFICATION_REQUIRED"
    status: "OPEN_CONTROLLED"

  - issue_id: "ISSUE-KM-002"
    title: "MOC/MARD Sub-sector Threshold Harmonization"
    description: "MOC Circular 13/2024 and MARD Circular 19/2024 contain specific sub-sector thresholds requiring mapping to QĐ 42/2026 facility categories."
    owning_artifact: "EC-SPM-001"
    classification: "DEFERRED_TO_OTHER_ARTIFACT"
    status: "OPEN_CONTROLLED"

  - issue_id: "ISSUE-KM-003"
    title: "IPCC AR5 vs AR6 GWP Transition Window"
    description: "Ministry circulars reference IPCC AR5 100-year GWPs, while international voluntary reporting defaults to AR6."
    owning_artifact: "EC-EFDB-001"
    classification: "HUMAN_JUDGMENT_REQUIRED"
    status: "OPEN_CONTROLLED"
