acceptance_criteria:
  - id: "AC-001"
    statement: "The cross-executor protocol defines one repository-owned continuity model for HTW, MSW, TVW, ChatGPT, and future authorized executors."
    verification_method: "Review the complete protocol against the owner-requested handoff scenarios and current repository governance."
    required_evidence_level: 1
    required: true
  - id: "AC-002"
    statement: "The protocol defines sequential writer release and receiver acceptance, and explicitly states that the YAML handoff/validator is not a technically enforced distributed lock."
    verification_method: "Inspect protocol and schema for sender stop/release, receiver verification/acceptance, task branch, checkpoint SHA, and conflict handling."
    required_evidence_level: 1
    required: true
  - id: "AC-003"
    statement: "The handoff JSON Schema and YAML template are mutually consistent and validate with the read-only validator."
    verification_method: "Run scripts/validate_worker_handoff.py against the canonical template and the automated positive/negative tests."
    required_evidence_level: 2
    required: true
  - id: "AC-004"
    statement: "The single start prompt instructs a receiving executor to verify repository identity, live main, handoff checkpoint, active Task Contract, required context, actual environment sync, and next permitted action before writing."
    verification_method: "Manual prompt review and a cold-start execution using only repository continuity sources; record the executor and evidence."
    required_evidence_level: 3
    required: true
  - id: "AC-005"
    statement: "The documented GAIS, VS Code/DeepSeek, and ChatGPT capability descriptions are grounded in current official sources and require per-session capability checks."
    verification_method: "Review source references and verify account-specific UI/tool capability during the pilot; report anything unavailable as UNKNOWN."
    required_evidence_level: 1
    required: true
  - id: "AC-006"
    statement: "The recovery test plan covers HTW-to-MSW, MSW-to-TVW, TVW-to-GAIS, fresh ChatGPT recovery, abrupt quota interruption, uncommitted work, and concurrent-writer/conflict cases."
    verification_method: "Inspect the test plan and confirm each scenario has preconditions, actions, expected results, evidence required, and stop conditions."
    required_evidence_level: 1
    required: true
  - id: "AC-007"
    statement: "The dedicated GitHub Actions workflow runs the handoff validator and tests with least privilege and does not require PR-creation permission."
    verification_method: "Inspect workflow triggers and permissions; verify the workflow run on the implementation PR."
    required_evidence_level: 2
    required: true
  - id: "AC-008"
    statement: "Bootstrap, Continuity Protocol, Handoff Template, Next Chat Prompt, GitHub Verification Protocol, Continuity README, and Source Manifest are consistent and do not duplicate project state."
    verification_method: "Cross-document review, relative-link checks, CSV parsing, and confirmation that the seven canonical continuity records remain unchanged in role."
    required_evidence_level: 1
    required: true
  - id: "AC-009"
    statement: "The handoff log records the PR #20 checkpoint and current continuity automation finding as an append-only event supported by live GitHub evidence."
    verification_method: "Compare the new entry with PR #20, main SHA, workflow run logs, and the automation branch commit."
    required_evidence_level: 1
    required: true
  - id: "AC-010"
    statement: "Exactly seven files are created, eight files are modified, and zero files are deleted; no out-of-scope paths or prohibited changes appear in the PR."
    verification_method: "Inspect the complete paginated PR changed-file inventory and full diff."
    required_evidence_level: 1
    required: true
  - id: "AC-011"
    statement: "No repository setting, GitHub Actions permission, existing continuity-refresh workflow, machine snapshot, product baseline, project-specific state, private EFIN or ENERIXON source is changed."
    verification_method: "Review all changed paths, workflow permissions, repository settings evidence, and full diff against forbidden/protected paths."
    required_evidence_level: 1
    required: true
  - id: "AC-012"
    statement: "The task report distinguishes a system foundation that has been validated locally/CI from a real account-based HTW/MSW/TVW pilot that remains unverified until owner-supplied evidence exists."
    verification_method: "Review the final report and recovery test results; prohibit PASS labels without inspectable screenshots, commit SHAs, tool outputs, and receiver confirmation."
    required_evidence_level: 3
    required: true

verification:
  required: true
  minimum_evidence_level: 2
  checks:
    - id: "VC-001"
      kind: STATIC_ANALYSIS
      description: "Parse the handoff JSON Schema, validate the YAML template against it, and check that all required fields and enum values are consistent."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-002", "AC-003"]
    - id: "VC-002"
      kind: UNIT_TEST
      description: "Run positive and negative unit tests for the handoff validator."
      command: "python -m unittest tests.test_worker_handoff -v"
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-003"]
    - id: "VC-003"
      kind: STATIC_ANALYSIS
      description: "Parse all modified Markdown links, YAML and CSV; verify relative links and Source Manifest column consistency."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-008", "AC-009"]
    - id: "VC-004"
      kind: MANUAL_REVIEW
      description: "Inspect the complete implementation PR diff and exact CREATE/MODIFY/DELETE inventory against this Contract."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-010", "AC-011"]
    - id: "VC-005"
      kind: MANUAL_REVIEW
      description: "Human Owner reviews and decides whether to merge the implementation PR."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-001", "AC-002", "AC-004", "AC-005", "AC-006", "AC-007", "AC-008", "AC-009", "AC-010", "AC-011", "AC-012"]
    - id: "VC-006"
      kind: REAL_WORLD_CHECK
      description: "Human Owner conducts at least one real HTW-to-MSW handoff and one MSW-to-TVW handoff pilot after the foundation is available; provide visible sync state, remote commit SHAs, handoff YAML, receiving-worker report, and any blockers. Do not claim the pilot passed when only the documentation or local tests pass."
      evidence_level: 3
      required: true
      acceptance_criteria_refs: ["AC-004", "AC-005", "AC-006", "AC-012"]
  known_verification_limits:
    - "The executor cannot access the Human Owner's Google AI Studio accounts or see the HTW/MSW app settings unless the Human Owner supplies current evidence."
    - "The executor cannot assume the same GitHub repository is linked to both GAIS workers; each link, account permission, branch, and sync result must be verified in the actual UI."
    - "The executor cannot verify TVW local Git state without Human Owner supplied terminal output or an authorized local workspace tool."
    - "The handoff record and validator do not implement a distributed lock. One-writer coordination remains a human-controlled protocol unless a separate enforceable service is authorized."
    - "The official ChatGPT GitHub app is documented as read-only. Other connectors/Codex capabilities must be checked independently."
    - "The existing continuity-refresh workflow has a current GitHub Actions PR-creation permission failure. This Contract does not change repository settings or the existing refresh workflow."
    - "A test plan or prompt is not proof of an actual cross-executor pilot. Pilot acceptance requires Owner-supplied evidence."

