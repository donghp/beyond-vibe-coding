    identifier: "ChatGPT prepares and validates repository artifacts; Human Owner operates Google AI Studio/VS Code and supplies pilot evidence."
    capability_requirements:
      - "Read live GitHub repository metadata, files, branches, commits, PRs and workflow evidence."
      - "Create a dedicated branch and exact-path documentation/schema/script/test/workflow files after Contract approval."
      - "Run Python YAML/JSON Schema validation and unit tests."
      - "Inspect complete Git diff and PR file inventory."
      - "Do not claim direct access to HTW, MSW, TVW, Google AI Studio or the Human Owner's laptop."
      - "Do not modify repository settings, branch protections, secrets or the existing continuity refresh workflow."
  permitted_actions:
    - read
    - inspect
    - run_analysis
    - create
    - modify
    - run_tests
  human_approval:
    required: true
    status: APPROVED
    approver_role: "Human Owner / Product Owner"
    approval_reference: "Explicit Human Owner approval in the current conversation on 2026-11-07."
    rationale: "The Human Owner explicitly approved this exact Contract Revision 1, including the complete implementation scope, proposed R2 risk classification, Change Budget, acceptance criteria, verification requirements, and pilot boundaries. Implementation may proceed only after this approval record is merged into main."

stopping_conditions:
  - scope_expansion_required
  - protected_resource_detected
  - change_budget_exceeded
  - baseline_or_recovery_point_unverified
  - required_context_missing_or_conflicting
  - authorization_missing_or_revoked
  - verification_failed_or_insufficient
  - unexpected_file_change
  - risk_escalation
  - security_or_data_exposure
  - working_tree_changed_unexpectedly

retry_policy:
  max_repair_attempts: 1
  additional_attempts_require_approval: true
  retry_rationale: "One bounded repair attempt may correct YAML, JSON Schema, Markdown-link, CSV, or test formatting within the approved paths. Any change to scope, repository settings, security permissions, or worker synchronization behavior requires a revised Contract and explicit approval."

reporting:
  required_items:
    - task_and_run_identifiers
    - actual_file_inventory
    - created_modified_deleted_breakdown
    - scope_integrity_result
    - change_budget_result
    - verification_results
    - evidence_references
    - unresolved_findings
    - limitations
    - next_action
    - checkpoint_reference
    - handoff_reference
  out_of_scope_findings_must_be_recorded: true

continuity:
  checkpoint_required: true
  handoff_on_interruption: true
  recovery_instructions_ref: "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md; docs/continuity/BVC_NEXT_CHAT_PROMPT.md; docs/continuity/GITHUB_REPOSITORY_VERIFICATION.md"
