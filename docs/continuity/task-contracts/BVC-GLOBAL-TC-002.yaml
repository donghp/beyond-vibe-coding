# BVC Global Task Contract 002
# PROPOSED CONTRACT — not authorized for execution until approved by the Human Owner.
contract_version: "0.1.0"
contract_id: "BVC-GLOBAL-TC-002"
revision: 1
status: APPROVED
created_at: "2026-11-07"

task:
  id: "BVC-GLOBAL-CONT-002"
  title: "Cross-Executor Continuity and Recovery System — Foundation and Pilot Readiness"
  objective: >-
    Establish a provider-neutral, repository-owned handoff and recovery system
    that allows authorized AI executors to resume the same project task from a
    verified GitHub checkpoint across Google AI Studio workers HTW and MSW,
    DeepSeek in VS Code worker TVW, and ChatGPT or another authorized executor.
    Provide one reusable start prompt, a machine-readable handoff contract, a
    template, deterministic validation, cross-executor operating instructions,
    and a recovery test plan. Preserve the existing project authority,
    Task Contract, evidence, privacy, and Human Owner approval boundaries.
  requested_by: "Human Owner / Product Owner"

project:
  project_id: "BVC-BUILD-LEARN"
  repository:
    url: "https://github.com/donghp/beyond-vibe-coding"
    default_branch: "main"
  baseline:
    source_commit: "47ff9641cd720567dc1e2a4d3666daae44fc6df5"
    # CLEAN means the committed GitHub main snapshot at this SHA.
    # It does NOT describe the Human Owner's laptop, GAIS workspaces, or IDE working tree.
    working_tree_status: CLEAN
    architecture_baseline_refs:
      - "docs/continuity/BOOTSTRAP.md"
      - "docs/continuity/CONTINUITY_PROTOCOL.md"
      - "docs/continuity/GITHUB_REPOSITORY_VERIFICATION.md"
      - "docs/continuity/CURRENT_STATE.yaml"
      - "docs/continuity/HANDOFF_TEMPLATE.md"
      - "docs/continuity/BVC_NEXT_CHAT_PROMPT.md"
      - "docs/continuity/SOURCE_MANIFEST.csv"
      - "specifications/v0.1/task-contract.md"
      - "specifications/v0.1/task-contract.schema.json"
    recovery_point:
      kind: git_commit
      reference: "main@47ff9641cd720567dc1e2a4d3666daae44fc6df5"
      verified: true

intent:
  objective: "Make BVC project work recoverable and transferable between authorized AI executors using a verified repository checkpoint and one shared start prompt."
  rationale: >-
    The project must not depend on the memory, quota, provider, model, application,
    or session of one AI executor. HTW and MSW use Google AI Studio Build Mode;
    TVW uses DeepSeek through VS Code; ChatGPT may inspect the repository through
    an on-demand GitHub connection or another explicitly available tool. These
    environments have different capabilities and synchronization controls. A
    common handoff record and recovery procedure is needed to preserve task,
    contract, branch, commit, file-change, verification, and writer-release state.
  expected_outcome: >-
    A portable cross-executor continuity protocol, one reusable start prompt,
    a versioned worker-handoff schema and template, a local validator and tests,
    a recovery test plan, and documentation/CI integration. The system will
    support controlled sequential handoff; it will not claim to provide a
    universal real-time collaboration service, automatic quota detection,
    guaranteed two-way sync in every executor, or an enforced distributed lock.
  business_or_user_value: >-
    Human Owner can switch from HTW to MSW or TVW without reconstructing project
    context from chat history. Each receiving executor can verify the same
    repository checkpoint, load the active Task Contract and required context,
    and continue only the next authorized action.

risk:
  level: R2
  policy_ref: "Task-specific proposed classification; no approved repository-wide R0-R5 risk mapping has been identified. See specifications/v0.1/task-contract.md#4.4. The Human Owner must confirm or revise this classification before approval."
  rationale: >-
    The work is confined to continuity documentation, a handoff data schema,
    a read-only validator, tests, and a dedicated validation workflow. It changes
    the operating process for multiple executors and adds CI validation, so its
    impact is greater than a simple documentation-only edit. It does not modify
    product code, production systems, data, credentials, repository settings,
    the existing refresh workflow, or project-specific baselines. R2 is proposed,
    not a claim of an approved universal BVC risk mapping.
  impact_factors:
    - other
  reversibility: EASY
  risk_owner: "Human Owner / Product Owner"

scope:
  mode: WRITE
  allowed_changes:
    create:
      - "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md"
      - "docs/continuity/WORKER_HANDOFF.schema.json"
      - "docs/continuity/WORKER_HANDOFF.template.yaml"
      - "docs/continuity/CROSS_EXECUTOR_RECOVERY_TEST_PLAN.md"
      - "scripts/validate_worker_handoff.py"
      - "tests/test_worker_handoff.py"
      - ".github/workflows/validate-cross-executor-continuity.yml"
    modify:
      - "docs/continuity/BOOTSTRAP.md"
      - "docs/continuity/CONTINUITY_PROTOCOL.md"
      - "docs/continuity/HANDOFF_TEMPLATE.md"
      - "docs/continuity/BVC_NEXT_CHAT_PROMPT.md"
      - "docs/continuity/GITHUB_REPOSITORY_VERIFICATION.md"
      - "docs/continuity/README.md"
      - "docs/continuity/SOURCE_MANIFEST.csv"
      - "docs/continuity/HANDOFF_LOG.md"
    delete: []
  forbidden_paths:
    - "docs/continuity/CURRENT_STATE.yaml"
    - "docs/continuity/DECISIONS.md"
    - ".github/workflows/continuity-refresh.yml"
    - "requirements-dev.txt"
    - "projects/task-management/continuity/PROJECT_STATE.json"
    - "projects/task-management/continuity/HANDOFF_LOG.md"
    - "projects/task-management/continuity/registers/TASK_EXECUTION_REGISTER.yaml"
    - "projects/task-management/continuity/evidence/EVIDENCE_INDEX.yaml"
  forbidden_path_prefixes:
    - "projects/"
    - "practical-labs/"
    - "specifications/"
    - "templates/"
    - "src/"
    - "app/"
    - "public/"
  protected_resource_refs:
    - "docs/continuity/CURRENT_STATE.yaml#machine_snapshot"
    - "docs/continuity/DECISIONS.md"
    - ".github/workflows/continuity-refresh.yml"
    - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
    - "projects/task-management/phase3.3/task-contracts/"
    - "projects/task-management/continuity/"
    - "private EFIN source material, credentials, customer data, and logs"
    - "private ENERIXON MDS and corporate design-system sources"
  scope_expansion_allowed: false
  scope_expansion_policy: STOP_AND_REQUEST_APPROVAL
  discovery_outside_scope_allowed: true
  stop_if_out_of_scope_change_detected: true

constraints:
  - "Do not modify main directly. All implementation changes must be on a dedicated branch and submitted through a Pull Request."
  - "Do not merge a Pull Request. Human Owner review and merge are required."
  - "Treat GitHub main and approved canonical project records as durable project truth; chat memory, old ZIP files, and handoff summaries are not substitutes."
  - "Use the worker aliases supplied by the Human Owner: HTW = Hoàng Trung Worker in Google AI Studio; MSW = Mã Siêu Worker in Google AI Studio; TVW = Triệu Vân Worker using DeepSeek in VS Code. These are operational aliases, not credentials or proof of account access."
  - "Use one provider-neutral start prompt for all authorized executors. The prompt must discover the current executor capabilities and must not assume a specific tool is available."
  - "The start prompt must read and reconcile the live repository, current handoff, active Task Contract, required context, and evidence before proposing or performing work."
  - "An executor may continue implementation only when the active Task Contract is APPROVED, its required context is available, its exact scope and recovery point are verified, and the current executor has been authorized for the task."
  - "A worker handoff requires a committed and remotely verified checkpoint, exact branch and commit SHA, actual file operation inventory, verification evidence, unresolved findings, next permitted action, and explicit release by the sending writer."
  - "The receiving worker must verify the checkpoint and accept the handoff before writing. If the sender has not released the writer role or the receiver cannot verify the remote checkpoint, stop writes."
  - "One active writer per task/working branch is a mandatory coordination rule. The handoff schema and validator record compliance but do not constitute a distributed lock or technically enforce exclusive access."
  - "Prefer one shared task branch for sequential handoff between workers. Do not push directly to main. A completed task is submitted by Pull Request for Human Owner review."
  - "If quota ends unexpectedly before a commit/push, recover only the last remotely verified commit. Uncommitted in-memory changes are not assumed to be recoverable and may need to be repeated."
  - "For Google AI Studio Build Mode, document its official GitHub import/push/pull/conflict-resolution capabilities, but require the Human Owner to verify the actual app, linked repository, branch, account permissions, and sync result on each worker."
  - "For VS Code / TVW, require local git status, branch, HEAD, remote, fetch result, and fast-forward pull verification before continuing. Never infer local state from GitHub."
  - "For ChatGPT, distinguish the official read-only GitHub app from any separately available connector or Codex write capability. A successful read does not prove write capability."
  - "Do not claim that the single start prompt automatically creates external account access, bypasses quota, performs an unverified pull/push, executes a task without an approved Contract, or deploys an application."
  - "Do not create, store, or publish access tokens, passwords, API keys, customer data, private EFIN information, or private ENERIXON source material."
  - "Do not enable or change GitHub Actions permissions, repository settings, branch protection, secrets, or rulesets."
  - "Do not modify the existing continuity-refresh workflow or attempt to repair its PR-creation permission failure under this Contract."
  - "Preserve the existing seven canonical global continuity records. Supporting protocols and templates do not become new state stores unless explicitly approved."
  - "Do not modify the global machine snapshot or semantic portfolio fields in CURRENT_STATE.yaml. The existing automation branch snapshot is a separate proposal that requires its own Owner-reviewed recovery path."
  - "Do not modify BVC Task Management product baselines, project-specific decisions, Task Contracts, execution registers, evidence indexes, or UX/architecture acceptance."
  - "Do not claim that the real HTW-to-MSW or MSW-to-TVW pilot has passed until the Human Owner supplies inspectable evidence from the actual GAIS and VS Code environments."

