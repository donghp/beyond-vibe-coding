  required: true
  minimum_evidence_level: 1
  checks:
    - id: "VC-001"
      kind: "STATIC_ANALYSIS"
      description: "Validate this proposed Task Contract against the BVC Task Contract v0.1.0 JSON Schema."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-001", "AC-002", "AC-003", "AC-004", "AC-005", "AC-006", "AC-009"]
    - id: "VC-002"
      kind: "STATIC_ANALYSIS"
      description: "Parse all modified Markdown links and the Global Source Manifest CSV; resolve exact new source paths and verify unique source IDs."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-006", "AC-008", "AC-009"]
    - id: "VC-003"
      kind: "MANUAL_REVIEW"
      description: "Inspect the complete implementation PR diff and exact CREATE/MODIFY/DELETE inventory against this approved Contract."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-001", "AC-002", "AC-003", "AC-004", "AC-005", "AC-006", "AC-007", "AC-008", "AC-009"]
    - id: "VC-004"
      kind: "MANUAL_REVIEW"
      description: "Human Owner reviews the implementation PR and explicitly decides whether to merge it."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: ["AC-010"]
    - id: "VC-005"
      kind: "REAL_WORLD_CHECK"
      description: "Run at least one actual new-ChatGPT-window cold-start after implementation merge. Confirm the report is produced from live GitHub, the first response asks for Owner review, and no write/prompt/task continuation occurs before the Owner confirms."
      evidence_level: 3
      required: true
      acceptance_criteria_refs: ["AC-004", "AC-005", "AC-006"]
    - id: "VC-006"
      kind: "REAL_WORLD_CHECK"
      description: "When DeepSeek/VS Code access becomes available, perform a controlled read-only reviewer pilot using the same semantic Task Contract as the Gemini adapter. Do not claim a DeepSeek pilot passed while environment access remains UNKNOWN."
      evidence_level: 3
      required: false
      acceptance_criteria_refs: ["AC-001", "AC-003"]

  known_verification_limits:
    - "ChatGPT cannot infer local Windows working-tree state, GAIS private app state, or DeepSeek/VS Code availability from GitHub. The Human Owner must supply current evidence."
    - "The real cold-start test cannot be completed within a documentation-only PR; it is a post-merge pilot and must remain NOT_RUN until actually performed."
    - "DeepSeek/VS Code role definition does not establish a current connected account, model label, quota or repository permission."
    - "The first Project Understanding Review is a chat response. It must not be stored as a canonical state copy unless a material correction or decision is explicitly approved."
    - "The supplied book PDF is the methodological reference. This Contract must preserve its terminology and distinctions without claiming the book is itself a repository authority artifact."

