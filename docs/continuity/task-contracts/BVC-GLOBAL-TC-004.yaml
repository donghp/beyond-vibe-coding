# BVC Global Task Contract 004
# Proposed by ChatGPT Chief Architect for Human Owner review.
# PROPOSED is not execution authority. Do not create implementation prompts or modify implementation outputs until this exact revision is approved and canonical on main.
contract_version: "0.1.0"
contract_id: "BVC-GLOBAL-TC-004"
revision: 1
status: APPROVED
created_at: "2026-11-11T00:00:00Z"

task:
  id: "BVC-GLOBAL-CONT-004"
  title: "Bootstrap Project Understanding Review and AI Executor Role Model"
  objective: >-
    Strengthen the BVC GitHub-first continuity process so every new ChatGPT
    window reconstructs the current project from live canonical records,
    produces a structured Project Understanding Review for the Human Owner,
    and pauses for explicit confirmation before proposing or performing the
    next task. Establish one shared Engineering Method and a provider-neutral
    AI role model for ChatGPT as Chief Architect and Project Engineering
    Orchestrator, Gemini in Google AI Studio as the primary implementation
    worker, and DeepSeek in VS Code as an independent reviewer/tester or
    separately authorized implementation worker.
  requested_by: "Human Owner / Product Owner"

project:
  project_id: "BVC-BUILD-LEARN"
  repository:
    url: "https://github.com/donghp/beyond-vibe-coding"
    default_branch: "main"
  baseline:
    source_commit: "7d438404c21158462acde97afe9c4d5b3ebcf923"
    working_tree_status: CLEAN
    pre_existing_changes_ref: >-
      CLEAN refers only to the committed GitHub main snapshot at the stated
      SHA. The Human Owner's Windows worktrees, GAIS app, and VS Code/DeepSeek
      environment are separate and are not represented as clean or synchronized.
    architecture_baseline_refs:
      - "docs/continuity/BOOTSTRAP.md"
      - "docs/continuity/START_HERE.md"
      - "docs/continuity/BVC_NEXT_CHAT_PROMPT.md"
      - "docs/continuity/TASK_LIFECYCLE.md"
      - "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md"
      - "docs/continuity/GITHUB_REPOSITORY_VERIFICATION.md"
      - "docs/continuity/SOURCE_MANIFEST.csv"
      - "specifications/v0.1/task-contract.md"
      - "specifications/v0.1/task-contract.schema.json"
    recovery_point:
      kind: git_commit
      reference: "main@7d438404c21158462acde97afe9c4d5b3ebcf923"
      verified: true

intent:
  objective: >-
    Make the first response of every new ChatGPT session a verified,
    source-backed project-understanding report that the Human Owner can review,
    while clarifying how the same task and Engineering Method are routed to
    different authorized AI executors.
  rationale: >-
    Reconstructing long chat histories wastes time and creates stale or
    conflicting interpretations. The repository already contains a Global
    Continuity Engine, Project State, Task and Prompt Registers, Evidence
    Index, handoff records, and a single-prompt entry point. The remaining
    operational gap is that a new session is not required to demonstrate its
    understanding and wait for Human Owner review before continuing. The
    project also needs an explicit role assignment that distinguishes
    architecture/orchestration from implementation and independent
    verification, without creating multiple sources of truth or concurrent
    writers.
  expected_outcome: >-
    A canonical AI Executor Role Model, a reusable Project Understanding
    Review template, and coordinated updates to the Global Bootstrap,
    Start Here page, new-chat prompt, Task Lifecycle, Cross-Executor protocol,
    continuity README, and source manifest. Every new ChatGPT window must
    bootstrap read-only, produce the structured review in Vietnamese, ask the
    Human Owner to confirm or correct its understanding, and stop in
    WAITING_FOR_OWNER_REVIEW until the Owner responds.
  business_or_user_value: >-
    The Human Owner can move to a new ChatGPT window and provide only new
    GAIS screenshots or copied Gemini/DeepSeek execution results after the
    understanding review is confirmed. The project remains independent of
    chat memory, model provider, executor quota, and session lifetime.

risk:
  level: R2
  policy_ref: "Task-specific R2 proposal based on BVC-GLOBAL-TC-002 Revision 1's R2 continuity-system precedent and specifications/v0.1/task-contract.md. Human Owner approval of this Contract's risk classification is pending."
  rationale: >-
    The outputs are documentation and operating-protocol changes, but they
    affect who may design, execute, review, accept, and continue engineering
    work across the repository. An ambiguous role or bootstrap gate could
    lead to unauthorized changes or incorrect project-state claims. The
    scope does not change application code, product behavior, security
    controls, data, dependencies, repository settings, or external services.
  impact_factors:
    - other
  reversibility: EASY
  risk_owner: "Human Owner / Product Owner"

scope:
  mode: WRITE
  allowed_changes:
    create:
      - "docs/continuity/AI_EXECUTOR_ROLE_MODEL.md"
      - "docs/continuity/PROJECT_UNDERSTANDING_REVIEW.template.md"
    modify:
      - "docs/continuity/START_HERE.md"
      - "docs/continuity/BVC_NEXT_CHAT_PROMPT.md"
      - "docs/continuity/BOOTSTRAP.md"
      - "docs/continuity/README.md"
      - "docs/continuity/TASK_LIFECYCLE.md"
      - "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md"
      - "docs/continuity/SOURCE_MANIFEST.csv"
    delete: []
  forbidden_paths:
    - "docs/continuity/CURRENT_STATE.yaml"
    - "docs/continuity/DECISIONS.md"
    - "docs/continuity/HANDOFF_LOG.md"
    - "docs/continuity/HANDOFF_TEMPLATE.md"
    - "docs/continuity/task-contracts/"
    - "projects/task-management/continuity/"
    - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
    - "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
    - "projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md"
  forbidden_path_prefixes:
    - "projects/"
    - "practical-labs/"
    - "specifications/"
    - "scripts/"
    - "tests/"
    - ".github/"
    - "templates/"
  protected_resource_refs:
    - "The seven canonical Global Continuity records and their existing ownership semantics."
    - "BVC Task Management Product Definition v0.2.0."
    - "BVC Task Management Decision Register, Risk Policy, UX and Architecture acceptance records."
    - "All existing Task Contracts, Task IDs, Prompt IDs, Prompt Register, Task Register, Project State and Evidence Index."
    - "The current approved BVC Engineering Method and Task Contract Specification; this task may document adapters but may not silently revise those standards."
    - "Private EFIN information and private ENERIXON sources, credentials, customer data and corporate design-system materials."
  scope_expansion_allowed: false
  scope_expansion_policy: STOP_AND_REQUEST_APPROVAL
  discovery_outside_scope_allowed: true
  stop_if_out_of_scope_change_detected: true

constraints:
  - "Do not modify main directly. Implementation work must use a dedicated branch and Pull Request after this Contract is APPROVED and canonical on main."
  - "Do not merge the implementation Pull Request. Human Owner review and merge authority remain with the Human Owner."
  - "This Contract PR contains only this proposed Contract. It does not implement its own deliverables."
  - "Do not publish an implementation prompt for this task before this Contract is approved and merged to main."
  - "Human Owner remains the final Product, Architecture, Governance, task-approval, risk-escalation, acceptance and merge authority."
  - "ChatGPT is assigned the working role of Chief Architect and Project Engineering Orchestrator: design and challenge platform/system/module architecture; decompose product intent into tasks; prepare Task Specifications, Contracts, context packages and provider-specific prompts; review executor results; and reconcile proposed records. This role does not grant ChatGPT final architecture approval, self-approval, merge authority or permission to exceed a Contract."
  - "Gemini on Google AI Studio is the primary Vibe Coding implementation worker for beginner practical labs and GAIS app work when the active Contract routes the task to GAIS. Gemini receives the approved semantic task through a GAIS-specific prompt adapter and may change only the exact authorized paths."
  - "DeepSeek in VS Code is assigned as the independent engineering reviewer/tester/code auditor by default when available: inspect diffs, run authorized tests, identify defects, security or architecture deviations, and report findings. DeepSeek may act as an implementation worker only when a Task Contract or explicit Owner authorization assigns it that role and the prior writer has released the workspace."
  - "The actual DeepSeek model, VS Code access, local Git capability, account connection and quota remain UNKNOWN until verified in the active session. Role assignment is not evidence of connectivity."
  - "The actual GAIS app and model label must be verified from current Owner-supplied evidence. Historical labels or app screenshots are not proof of present session capability."
  - "Use one semantic Task Contract for all executors. Provider-specific prompts may differ in format and tool instructions, but the objective, authorization, scope, acceptance criteria, risk, and verification expectations must remain invariant."
  - "Do not allow concurrent writes to the same task branch or workspace. Multiple AIs may participate sequentially or in a controlled discovery/review pipeline; only one authorized writer may modify a task branch at a time."
  - "When executors disagree, record the conflicting proposals and evidence explicitly. Do not decide by model majority, confidence, or semantic similarity. Escalate unresolved architecture, product, governance, security or scope conflicts to the Human Owner."
  - "A fresh ChatGPT session must complete a read-only live bootstrap and produce the Project Understanding Review before generating a task, Contract, prompt, code change, PR, acceptance or next implementation action."
  - "After the Project Understanding Review, ChatGPT must explicitly ask the Human Owner to confirm or correct the understanding and enter WAITING_FOR_OWNER_REVIEW. It must not continue merely because it has found a valid next action."
  - "Only after the Human Owner confirms the understanding may ChatGPT resume the next action permitted by a current approved Contract or explicit Owner instruction."
  - "The Project Understanding Review is a session response, not a duplicate Project State. Do not commit a separate report for every chat window unless a material correction, decision or state transition must be persisted."
  - "Use the existing Source Manifest and authority order. Retrieval relevance or the presence of a file does not make it canonical. Reconcile conflicts against approved authority and current evidence."
  - "Build task-specific context from current state, canonical knowledge, authority, dependencies, recent changes and evidence. Do not force every executor to ingest the entire repository for every task."
  - "GitHub main and the canonical records stored in the repository are the controlled remote recovery source for this project. Git history alone is not Project Continuity; Project Knowledge, Project State, Decisions, Evidence, Run Records, Checkpoints and Handoffs retain distinct meanings."
  - "Do not modify project-specific registers or Practical Labs learner content under this Contract. If bootstrap reconciliation discovers project-specific stale records, report the conflict and create a separate scoped Task Contract proposal."
  - "Do not claim cold-start, cross-model, GAIS quota-interruption or DeepSeek recovery tests have passed unless a real pilot is executed and evidence is recorded under the authorized validation process."
  - "Preserve the book's method: one method, multiple executors, one project; prompt is not context; a claim is not evidence; capability does not create authority; architecture is human-governed."

