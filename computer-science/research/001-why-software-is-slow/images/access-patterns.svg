<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Row-major versus column-wise access</title><desc id="desc">A 4 by 4 row-major matrix showing contiguous row access compared with strided column access.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061735"/><stop offset="1" stop-color="#0b3760"/></linearGradient></defs>
<rect width="1200" height="720" rx="30" fill="url(#bg)"/>
<text x="600" y="65" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle">SAME BIG O · DIFFERENT ACCESS PATTERNS</text>
<g font-family="Arial,sans-serif"><text x="300" y="130" fill="#54d9ef" font-size="27" font-weight="700" text-anchor="middle">ROW-MAJOR</text><text x="900" y="130" fill="#ffd45c" font-size="27" font-weight="700" text-anchor="middle">COLUMN-WISE</text></g>
<g transform="translate(130 175)" font-family="Arial,sans-serif" text-anchor="middle" font-size="25" font-weight="700">
<g fill="#0d78c9" stroke="#77e8ff" stroke-width="3"><rect x="0" y="0" width="85" height="85" rx="9"/><rect x="90" y="0" width="85" height="85" rx="9"/><rect x="180" y="0" width="85" height="85" rx="9"/><rect x="270" y="0" width="85" height="85" rx="9"/></g>
<g fill="#d8efff"><text x="42" y="53">0</text><text x="132" y="53">1</text><text x="222" y="53">2</text><text x="312" y="53">3</text></g>
<g fill="#183e69" stroke="#77e8ff" stroke-width="3"><rect x="0" y="90" width="85" height="85" rx="9"/><rect x="90" y="90" width="85" height="85" rx="9"/><rect x="180" y="90" width="85" height="85" rx="9"/><rect x="270" y="90" width="85" height="85" rx="9"/><rect x="0" y="180" width="85" height="85" rx="9"/><rect x="90" y="180" width="85" height="85" rx="9"/><rect x="180" y="180" width="85" height="85" rx="9"/><rect x="270" y="180" width="85" height="85" rx="9"/><rect x="0" y="270" width="85" height="85" rx="9"/><rect x="90" y="270" width="85" height="85" rx="9"/><rect x="180" y="270" width="85" height="85" rx="9"/><rect x="270" y="270" width="85" height="85" rx="9"/></g>
<g fill="#b9d9ef"><text x="42" y="143">4</text><text x="132" y="143">5</text><text x="222" y="143">6</text><text x="312" y="143">7</text><text x="42" y="233">8</text><text x="132" y="233">9</text><text x="222" y="233">10</text><text x="312" y="233">11</text><text x="42" y="323">12</text><text x="132" y="323">13</text><text x="222" y="323">14</text><text x="312" y="323">15</text></g>
</g>
<g transform="translate(730 175)" font-family="Arial,sans-serif" text-anchor="middle" font-size="25" font-weight="700">
<g fill="#b97816" stroke="#ffe07b" stroke-width="3"><rect x="0" y="0" width="85" height="85" rx="9"/><rect x="90" y="0" width="85" height="85" rx="9"/><rect x="180" y="0" width="85" height="85" rx="9"/><rect x="270" y="0" width="85" height="85" rx="9"/></g>
<g fill="#fff0c4"><text x="42" y="53">0</text><text x="132" y="53">1</text><text x="222" y="53">2</text><text x="312" y="53">3</text></g>
<g fill="#183e69" stroke="#ffe07b" stroke-width="3"><rect x="0" y="90" width="85" height="85" rx="9"/><rect x="90" y="90" width="85" height="85" rx="9"/><rect x="180" y="90" width="85" height="85" rx="9"/><rect x="270" y="90" width="85" height="85" rx="9"/><rect x="0" y="180" width="85" height="85" rx="9"/><rect x="90" y="180" width="85" height="85" rx="9"/><rect x="180" y="180" width="85" height="85" rx="9"/><rect x="270" y="180" width="85" height="85" rx="9"/><rect x="0" y="270" width="85" height="85" rx="9"/><rect x="90" y="270" width="85" height="85" rx="9"/><rect x="180" y="270" width="85" height="85" rx="9"/><rect x="270" y="270" width="85" height="85" rx="9"/></g>
<g fill="#b9d9ef"><text x="42" y="143">4</text><text x="132" y="143">5</text><text x="222" y="143">6</text><text x="312" y="143">7</text><text x="42" y="233">8</text><text x="132" y="233">9</text><text x="222" y="233">10</text><text x="312" y="233">11</text><text x="42" y="323">12</text><text x="132" y="323">13</text><text x="222" y="323">14</text><text x="312" y="323">15</text></g>
<rect x="-5" y="-5" width="95" height="365" rx="12" fill="none" stroke="#ffe36b" stroke-width="6" stroke-dasharray="12 8"/>
</g>
<text x="300" y="585" fill="#8df0ff" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">0 → 1 → 2 → 3 → ...</text>
<text x="900" y="585" fill="#ffe07b" font-family="Arial,sans-serif" font-size="22" text-anchor="middle">0 → 4 → 8 → 12 → ...</text>
<text x="600" y="642" fill="#fff" font-family="Arial,sans-serif" font-size="21" text-anchor="middle">Row-major storage: row access is contiguous; column access uses a stride.</text>
<text x="600" y="687" fill="#54d9ef" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">AI IS A TOOL. ENGINEERING IS OUR CAPABILITY. · DONG HONG</text>
</svg>