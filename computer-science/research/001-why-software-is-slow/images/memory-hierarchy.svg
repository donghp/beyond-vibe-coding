<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Memory hierarchy</title><desc id="desc">Conceptual hierarchy from CPU registers through cache, DRAM and persistent storage.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061735"/><stop offset="1" stop-color="#0b3760"/></linearGradient></defs>
<rect width="1200" height="860" rx="32" fill="url(#bg)"/>
<text x="600" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff" text-anchor="middle">MEMORY HIERARCHY</text>
<text x="600" y="122" font-family="Arial,sans-serif" font-size="19" fill="#a9d9f5" text-anchor="middle">Conceptual view — not to scale; implementations vary</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="250" y="170" width="700" height="86" rx="18" fill="#d9f8ff"/><text x="600" y="207" font-size="27" font-weight="700" fill="#07345d">CPU REGISTERS</text><text x="600" y="237" font-size="17" fill="#164d73">Values used directly by instructions</text>
<path d="M600 257v26m-12-10 12 12 12-12" stroke="#35d8f1" stroke-width="5" fill="none"/>
<rect x="280" y="294" width="640" height="82" rx="18" fill="#b9edff"/><text x="600" y="328" font-size="26" font-weight="700" fill="#07345d">L1 CACHE</text><text x="600" y="355" font-size="17" fill="#164d73">Small, close to the execution core</text>
<path d="M600 377v24m-12-10 12 12 12-12" stroke="#35d8f1" stroke-width="5" fill="none"/>
<rect x="310" y="414" width="580" height="78" rx="18" fill="#8bdcff"/><text x="600" y="447" font-size="26" font-weight="700" fill="#07345d">L2 CACHE</text><text x="600" y="474" font-size="17" fill="#164d73">Next cache level</text>
<path d="M600 493v24m-12-10 12 12 12-12" stroke="#35d8f1" stroke-width="5" fill="none"/>
<rect x="340" y="530" width="520" height="78" rx="18" fill="#52b7ef"/><text x="600" y="563" font-size="26" font-weight="700" fill="#06294c">L3 / LAST-LEVEL CACHE</text><text x="600" y="590" font-size="17" fill="#06294c">Often shared on many processors</text>
<path d="M600 609v24m-12-10 12 12 12-12" stroke="#35d8f1" stroke-width="5" fill="none"/>
<rect x="370" y="646" width="460" height="72" rx="18" fill="#197fc1"/><text x="600" y="676" font-size="25" font-weight="700" fill="#fff">MAIN MEMORY — DRAM</text><text x="600" y="701" font-size="16" fill="#d5f3ff">Larger capacity, higher access latency</text>
<path d="M600 719v20m-12-8 12 12 12-12" stroke="#35d8f1" stroke-width="5" fill="none"/>
<rect x="400" y="752" width="400" height="64" rx="16" fill="#123e69" stroke="#28cce8" stroke-width="2"/><text x="600" y="779" font-size="23" font-weight="700" fill="#fff">SSD / HDD STORAGE</text><text x="600" y="802" font-size="15" fill="#bdeaff">Accessed through the I/O stack</text>
</g>
<text x="70" y="390" font-family="Arial,sans-serif" font-size="18" fill="#72e5f4">Closer to CPU</text><path d="M190 385h55" stroke="#72e5f4" stroke-width="3"/>
<text x="72" y="420" font-family="Arial,sans-serif" font-size="15" fill="#b3d7eb">Typically lower latency</text>
<text x="930" y="680" font-family="Arial,sans-serif" font-size="18" fill="#72e5f4">Larger capacity</text><path d="M850 675h60" stroke="#72e5f4" stroke-width="3"/>
<text x="930" y="710" font-family="Arial,sans-serif" font-size="15" fill="#b3d7eb">Typically higher latency</text>
<text x="600" y="842" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">BEYOND VIBE CODING — DONG HONG</text>
</svg>