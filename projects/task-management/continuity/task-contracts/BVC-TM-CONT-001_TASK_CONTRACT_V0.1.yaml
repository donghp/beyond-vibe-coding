    statement: "The continuity package preserves exactly one canonical Project State, Source Manifest, Handoff Log, Task Execution Register and Evidence Index; no duplicate state store or shadow register is introduced."
    verification_method: "Inspect the complete BVCTM continuity tree and compare README, Profile and Source Manifest; confirm each canonical record has one path."
    required_evidence_level: 1
    required: true
  - id: AC-002
    statement: "00_BVC_PROJECT_CONTINUITY.md contains the single copy-ready provider-neutral bootstrap prompt, and README links to that entry point without introducing a second competing prompt."
    verification_method: "Review live repository verification, required reading sequence, executor identity/capabilities, authority gate, workspace sync check and Vietnamese recovery report requirements."
    required_evidence_level: 1
    required: true
  - id: AC-003
    statement: "The recovery instructions explain that a DeepSeek/VS Code receiver can resume only from remotely verified commits or supplied exported artifacts; uncommitted/in-memory GAIS state is not assumed recoverable from GitHub."
    verification_method: "Inspect the bootstrap prompt, External System Register and handoff instructions for quota interruption, missing checkpoint and stop behavior."
    required_evidence_level: 1
    required: true
  - id: AC-004
    statement: "PROJECT_STATE.json is refreshed against the verified source baseline and validates against the current Draft/Experimental project-state.schema.json without adding unsupported fields."
    verification_method: "Run JSON parsing and Draft 2020-12 schema validation; manually compare task, milestone, decisions, risks, open issues and recovery references against canonical sources."
    required_evidence_level: 2
    required: true
  - id: AC-005
    statement: "SOURCE_MANIFEST.csv contains one row per canonical source, consistent columns, resolvable repository paths or explicit external URLs, and clear authority/limitation notes."
    verification_method: "Parse CSV, check unique source IDs, resolve every repository-relative path against the reconciled main tree, and inspect authority and bootstrap requirements."
    required_evidence_level: 2
    required: true
  - id: AC-006
    statement: "The Task Execution Register records BVC-TM-CONT-001 only after its Contract is APPROVED on main and never self-certifies IN_PROGRESS, READY_FOR_ACCEPTANCE or COMPLETED_ACCEPTED."
    verification_method: "Compare the register's task and Contract identity/status with the approved Contract on main and require separate Owner/governance evidence for any lifecycle transition."
    required_evidence_level: 1
    required: true
  - id: AC-007
    statement: "Prompt Register records Prompt #0001/#0002/#0003 by exact ID and path, distinguishes PUBLISHED, EXECUTED and ACCEPTED, and sets next_number to 4 without allocating Prompt #0004."
    verification_method: "Compare register entries to the three canonical prompt files and merged PR evidence; verify execution and acceptance statuses are not inferred from publication."
    required_evidence_level: 1
    required: true
  - id: AC-008
    statement: "External System Register distinguishes confirmed GitHub facts from Owner-reported or UNKNOWN GAIS, local Git, DeepSeek, VS Code, model and quota facts."
    verification_method: "Compare GitHub metadata with live refs/PRs; review external and local fields for unsupported claims."
    required_evidence_level: 1
    required: true
  - id: AC-009
    statement: "The handoffs directory instructions require each actual worker transition to be recorded in its own YAML file under continuity/handoffs/ using the Global Worker Handoff schema/template, with a verified checkpoint, sender release and receiver acceptance; no handoff record is fabricated when no real transition has occurred, and Handoff Log remains append-only history."
    verification_method: "Inspect handoffs/README.md for the canonical Global schema/template references, required checkpoint/release/acceptance fields, and the prohibition on fabricated handoffs. Validate an individual record against the Global schema only when a real, separately authorized handoff record exists; no such record is required for this task absent an actual transition."
    required_evidence_level: 1
    required: true
  - id: AC-010
    statement: "The GAIS quota interruption and GAIS-to-DeepSeek recovery test is added to the test plan and explicitly remains NOT_RUN until a real evidence-backed pilot occurs."
    verification_method: "Inspect CONTINUITY_TEST_PLAN.md and CONTINUITY_TEST_RESULTS.md; require executor identities, remote SHA, actual environment sync, handoff YAML and receiver report for future PASS."
    required_evidence_level: 1
    required: true
  - id: AC-011
    statement: "All actual changes match exact CREATE/MODIFY/DELETE lists and Change Budget; Product, UX, Architecture, Governance, Phase 3.3, Practical Labs, application and Global Continuity sources remain untouched."
    verification_method: "Generate a complete VCS-derived inventory from the approved source baseline to the implementation candidate commit, classifying every added, modified and deleted path and recording additions plus deletions, binary status and any sensitive categories. Run the Contract validator with --changed-files-json, then compare the inventory against the full PR changed-file list and diff to confirm exact operation scope, Change Budget and untouched protected paths."
    required_evidence_level: 2
    required: true

verification:
  required: true
  minimum_evidence_level: 1
  checks:
    - id: VC-001
      kind: STATIC_ANALYSIS
      description: "Parse PROJECT_STATE.json and validate it against project-state.schema.json Draft 2020-12."
      command: "python -c \"import json, jsonschema; s=json.load(open('specifications/v0.1/project-state.schema.json', encoding='utf-8')); d=json.load(open('projects/task-management/continuity/PROJECT_STATE.json', encoding='utf-8')); jsonschema.Draft202012Validator(s).validate(d); print('PASS: BVCTM Project State')\""
      evidence_level: 2
      required: true
      acceptance_criteria_refs: [AC-004]
    - id: VC-002
      kind: STATIC_ANALYSIS
      description: "Parse all BVCTM continuity YAML profile/register/evidence sources."
      command: "python -c \"import yaml, pathlib; p=pathlib.Path('projects/task-management/continuity'); files=[p/'PROJECT_CONTINUITY_PROFILE.yaml',p/'registers/TASK_EXECUTION_REGISTER.yaml',p/'registers/BVC_TM_PROMPT_REGISTER.yaml',p/'registers/EXTERNAL_SYSTEM_REGISTER.yaml',p/'evidence/EVIDENCE_INDEX.yaml']; [yaml.safe_load(x.read_text(encoding='utf-8')) for x in files]; print('PASS: BVCTM YAML')\""
      evidence_level: 2
      required: true
      acceptance_criteria_refs: [AC-006, AC-007, AC-008]
    - id: VC-003
      kind: STATIC_ANALYSIS
      description: "Parse Source Manifest CSV, require consistent columns and unique source_id values, and resolve repository-relative sources."
      command: "python -c \"import csv; p='projects/task-management/continuity/SOURCE_MANIFEST.csv'; rows=list(csv.DictReader(open(p, encoding='utf-8-sig', newline=''))); ids=[r['source_id'] for r in rows]; assert len(ids)==len(set(ids)); print('PASS: BVCTM Source Manifest', len(rows))\""
      evidence_level: 2
      required: true
      acceptance_criteria_refs: [AC-005]
    - id: VC-004
      kind: STATIC_ANALYSIS
      description: "Validate the Task Contract with the repository Task Contract schema and semantic validator."
      command: "python scripts/validate_task_contracts.py projects/task-management/continuity/task-contracts/BVC-TM-CONT-001_TASK_CONTRACT_V0.1.yaml"
      evidence_level: 1
      required: true
      acceptance_criteria_refs: [AC-011]
    - id: VC-005
      kind: MANUAL_REVIEW
      description: "Review the full diff, exact operation inventory, evidence labels, links and protected-resource boundaries."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: [AC-001, AC-002, AC-003, AC-009, AC-010, AC-011]
    - id: VC-006
      kind: MANUAL_REVIEW
      description: "Human Owner reviews the recovered state, single entry prompt, handoff protocol and exact file scope before accepting the continuity update."
      evidence_level: 1
      required: true
      acceptance_criteria_refs: [AC-001, AC-002, AC-003, AC-006, AC-007, AC-008, AC-009, AC-010]
    - id: VC-007
      kind: STATIC_ANALYSIS
      description: "Validate the complete VCS-derived changed-file inventory against this Contract's exact CREATE/MODIFY/DELETE scope and Change Budget. The inventory must cover the full implementation diff from the approved source baseline and include each path, operation, additions-plus-deletions diff_lines, is_binary flag, and any applicable sensitive categories."
      command: "python scripts/validate_task_contracts.py projects/task-management/continuity/task-contracts/BVC-TM-CONT-001_TASK_CONTRACT_V0.1.yaml --changed-files-json \"$env:TEMP\\bvc-tm-cont-001-changed-files.json\""
      evidence_level: 2
      required: true
      acceptance_criteria_refs: [AC-011]

  known_verification_limits:
    - "No executor can inspect private GAIS session contents unless the Human Owner supplies accessible screenshots or exported files."
    - "A DeepSeek model in VS Code cannot recover uncommitted GAIS in-memory state through GitHub."
    - "The latest Human Owner terminal output supplied on 2026-11-07, after fast-forward to main@400b8d5916bc66759597395905dfa2e153aca18b, showed a DIRTY local main: 00_BVC_PROJECT_CONTINUITY.md modified and two untracked A1-01/A1-02 PNG files under practical-labs/bvc-task-management/phase-a. This is time-bounded Owner-supplied evidence; re-check before any local write, and do not include those paths in this task."
    - "No GAIS-to-DeepSeek or cross-provider handoff pilot has been run by this Contract proposal."
    - "The Global Worker Handoff schema and validator do not create a distributed lock or prevent concurrent writers."
    - "The Project State specification/schema is Draft / Experimental v0.1.0; this task does not upgrade that specification."
    - "The Task Contract validation workflow is path-filtered to specifications/scripts/tests and does not automatically trigger merely because this project-specific Contract path changes. This Contract does not authorize workflow changes."

change_budget:
  max_changed_files: 13
  max_created_files: 1
  max_modified_files: 12
  max_deleted_files: 0
  max_total_diff_lines: 3000
  max_binary_files: 0
  allow_dependency_changes: false
  allow_lockfile_changes: false
  allow_database_schema_changes: false
  allow_financial_formula_changes: false
  allow_authentication_changes: false
  allow_architecture_changes: false

authority:
  policy_ref: >-
    docs/continuity/BOOTSTRAP.md; docs/continuity/CROSS_EXECUTOR_CONTINUITY.md;
    specifications/v0.1/task-contract.md; projects/task-management/governance/
    BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md. R1 classification is proposed;
    risk-policy publication metadata remains pending on main.
  requested_by: "Human Owner / Product Owner"
  authorized_by: "Human Owner / Product Owner"
  authorization_reference: >-
    The Human Owner requested preparation of Contract Revision 3 in the current
    conversation on 2026-11-07 after the local validator reported AC-009 and
    AC-011 evidence-level mismatches. This request authorizes preparation and
    publication of a PROPOSED revision for review only; it does not approve
    Revision 3 or authorize execution. The previously approved 13-path scope
    remains unchanged and still requires revision-specific Human Owner approval.
  executor:
    class: HYBRID
    identifier: "CHATGPT prepares bounded repository artifacts; Human Owner operates GAIS and local DeepSeek/VS Code sessions and supplies evidence; the receiving executor independently verifies remote checkpoints."
    capability_requirements:
      - "Read live GitHub repository identity, refs, branches, PRs, commits, files and workflow evidence."
      - "Prepare and validate exact-scope Markdown, JSON, YAML and CSV changes."
      - "Reuse the Global Worker Handoff schema and template without copying them."
      - "Do not claim direct access to the Human Owner's GAIS account or local Windows filesystem."
      - "Do not claim a specific DeepSeek model, quota, VS Code capability or repository synchronization without current evidence."
  permitted_actions:
    - read
    - inspect
    - run_analysis
    - create
    - modify
    - run_tests
  human_approval:
    required: true
    status: PENDING
    approver_role: "Human Owner / Product Owner"
    approval_reference: "Revision 2 approval remains evidenced by PR #32 and main@400b8d5916bc66759597395905dfa2e153aca18b. That approval does not cover the revised AC-009/AC-011 wording and VC-007 in Revision 3; explicit Revision 3 approval is pending."
    rationale: "Revision 2 was approved, but Revision 3 changes acceptance and verification requirements. Do not infer approval from Revision 2; execution remains blocked until the Human Owner explicitly approves Revision 3."

stopping_conditions:
  - scope_expansion_required
  - protected_resource_detected
  - change_budget_exceeded
  - baseline_or_recovery_point_unverified
  - required_context_missing_or_conflicting
  - authorization_missing_or_revoked
  - verification_failed_or_insufficient
  - unexpected_file_change
  - risk_escalation
  - security_or_data_exposure
  - working_tree_changed_unexpectedly
  - other

retry_policy:
  max_repair_attempts: 1
  additional_attempts_require_approval: true
  retry_rationale: "One bounded repair may correct Markdown, JSON, YAML, CSV or link formatting within exact approved paths. Any scope, risk, tool permission or workflow change requires a revised Contract."

reporting:
  required_items:
    - task_and_run_identifiers
    - actual_file_inventory
    - created_modified_deleted_breakdown
    - scope_integrity_result
    - change_budget_result
    - verification_results
    - evidence_references
    - unresolved_findings
    - limitations
    - next_action
    - checkpoint_reference
    - handoff_reference
  out_of_scope_findings_must_be_recorded: true

continuity:
  checkpoint_required: true
  handoff_on_interruption: true
  recovery_instructions_ref: "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md; projects/task-management/continuity/00_BVC_PROJECT_CONTINUITY.md"
