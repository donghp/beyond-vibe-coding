constraints:
  - "Keep exactly one canonical PROJECT_STATE.json, SOURCE_MANIFEST.csv, HANDOFF_LOG.md, TASK_EXECUTION_REGISTER.yaml, and EVIDENCE_INDEX.yaml for BVC Task Management. Do not create competing copies or shadow registries."
  - "Keep Task Contract IDs, Task IDs, Prompt IDs, Run IDs, and Handoff IDs distinct. Link records by ID and canonical path; do not copy full Contract or Prompt content into registers."
  - "Keep Global Continuity under docs/continuity/ and BVCTM-only continuity under projects/task-management/continuity/. Do not merge their state stores."
  - "Use the existing 00_BVC_PROJECT_CONTINUITY.md as the one canonical BVCTM entry point and place one copy-ready, provider-neutral recovery prompt there. Do not create a second competing BVCTM bootstrap prompt."
  - "The recovery prompt must instruct a new executor to verify repository identity, live main SHA, open PRs, branch/checkpoint state, read the Global Bootstrap and BVCTM canonical continuity records, inspect the BVCTM source tree, follow SOURCE_MANIFEST.csv, read the active Contract and required context, and report one next permitted action before writing."
  - "The recovery prompt must require the executor to declare its actual alias, model/tool label, environment, and verified capabilities. Unsupported capabilities must be UNKNOWN or UNAVAILABLE; never infer GAIS, GitHub write, local Git, DeepSeek, or VS Code access from a product name or prior session."
  - "For a GAIS quota interruption, DeepSeek may resume only from information it can actually access: verified remote commits, committed repository files, or artifacts explicitly exported and supplied by the Human Owner. Do not claim DeepSeek can read the private GAIS workspace or recover uncommitted in-memory changes."
  - "If the latest GAIS work is not committed, exported, or otherwise captured as an inspectable checkpoint, mark it LOCAL_ONLY / NOT_RECOVERABLE_FROM_GITHUB, stop dependent writes, and ask the Human Owner to preserve or supply the missing work."
  - "A worker handoff must identify active task and Contract revision, exact branch and commit SHA, source main SHA, changed-file inventory, verification results, sender release, receiver acceptance, workspace synchronization, blockers, and one next permitted action."
  - "Use docs/continuity/WORKER_HANDOFF.schema.json and docs/continuity/WORKER_HANDOFF.template.yaml as the only generic handoff schema/template. Do not copy or fork the Global schema into BVCTM."
  - "Store individual BVCTM worker handoff records under projects/task-management/continuity/handoffs/. The Handoff Log remains append-only event history and links to handoff records; it is not itself the current worker handoff payload."
  - "Do not create a handoff record claiming sender release or receiver acceptance unless an actual sender has stopped writing and the receiver has independently verified and accepted the exact remote checkpoint."
  - "One active writer per task/branch. The YAML record is not a technical lock; if writer exclusivity is uncertain, stop writes."
  - "Preserve Task Execution Register status semantics. The task may mirror an APPROVED Contract into the register only after that exact Contract is APPROVED on main. The executor must not set its own task to IN_PROGRESS, READY_FOR_ACCEPTANCE, or COMPLETED_ACCEPTED; those transitions require independent Human Owner/governance confirmation."
  - "Preserve the BVCTM prompt sequence. Record Prompt #0001/#0002/#0003 by existing IDs and canonical paths; set next_number to 4 only after both new prompt identities are verified. Do not allocate Prompt #0004 in this task."
  - "Record publication, execution, and acceptance separately for every Prompt. PR merge proves publication only. Prompt #0001/#0002/#0003 execution status must remain NOT_VERIFIED unless actual execution evidence is present."
  - "Update External System records only with verified or explicitly Owner-reported facts. Current local working tree, local branch, GAIS app state, DeepSeek model, quota, and VS Code connectivity remain UNKNOWN unless current evidence is supplied."
  - "Update Evidence Index with exact PR/commit/file references. The three GAIS JPG assets on main are repository-verified evidence assets; their presence does not prove the corresponding prompt was executed or the app is complete."
  - "Update Project State only using fields supported by specifications/v0.1/project-state.schema.json. Keep that schema's Draft/Experimental status visible; do not add unvalidated properties."
  - "Append to HANDOFF_LOG.md; do not rewrite H-0001 or H-0002 or make historical entries appear current."
  - "Add the GAIS-to-DeepSeek quota/interruption scenario to CONTINUITY_TEST_PLAN.md and record it as NOT_RUN in CONTINUITY_TEST_RESULTS.md until a real test is executed."
  - "Do not mark cold-start, cross-model, sender-release, receiver-acceptance, local-sync, GAIS-sync, or continuity pilot validation PASS without actual evidence."
  - "Keep formal Phase 3.1 UX Acceptance OPEN, Phase 3.2 at accepted-design-only status, and the existing Task #003 execution state NOT_STARTED_OR_NOT_EVIDENCED unless new canonical evidence proves otherwise."
  - "Do not change product scope, Product Definition, UX, Architecture, Governance decisions, risk policy, Phase 3.3 Contracts, application code, public Practical Labs lessons, CI, workflows, repository settings, secrets, database, Auth, hosting, or deployment."
  - "Do not place API keys, tokens, credentials, passwords, private account data, customer data, or confidential business data in continuity records or handoff YAML."
  - "The Contract source commit and recovery point identify the immutable remote main checkpoint. The Human Owner's local working tree was DIRTY at the latest supplied check and its three pre-existing paths are recorded in project.baseline.pre_existing_changes_ref; this proposal does not alter or include them. Before any local/IDE write, re-inspect the actual branch and working tree; dirty or unknown local state blocks local write operations."
  - "The original Phase 3.3 Task #002 is already COMPLETED_ACCEPTED. Do not reuse its ID; this continuity workstream uses BVC-TM-CONT-001."

