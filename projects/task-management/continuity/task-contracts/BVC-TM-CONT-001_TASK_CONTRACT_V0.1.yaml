task:
  id: "BVC-TM-CONT-001"
  title: "BVCTM PROJECT CONTINUITY RECONCILIATION AND CROSS-EXECUTOR RESUME"
  objective: >-
    Reconcile BVC Task Management project-owned continuity records against
    verified post-PR-30 main, establish one provider-neutral copy-ready
    recovery prompt in the existing project entry point, and define a reliable
    GAIS-to-DeepSeek/VS Code handoff path using committed checkpoints, the
    Global Worker Handoff schema, explicit writer release, and receiver
    acceptance. Preserve one canonical Project State, Source Manifest,
    Handoff Log, Task Execution Register, and Evidence Index for this project.
  requested_by: "Human Owner / Product Owner"

project:
  project_id: "BVC-TASK-MANAGEMENT"
  repository:
    url: "https://github.com/donghp/beyond-vibe-coding"
    default_branch: "main"
  baseline:
    source_commit: "400b8d5916bc66759597395905dfa2e153aca18b"
    working_tree_status: DIRTY
    pre_existing_changes_ref: "Human Owner terminal evidence supplied 2026-11-07: local main@400b8d5916bc66759597395905dfa2e153aca18b has a pre-existing modification to projects/task-management/continuity/00_BVC_PROJECT_CONTINUITY.md and two untracked files practical-labs/bvc-task-management/phase-a/a1-01-gais-start-screen.png and practical-labs/bvc-task-management/phase-a/a1-02-bvctm-initial-scaffold-preview.png. These local changes are excluded from this Contract proposal and must not be staged, reset, overwritten, or included in its implementation diff."
    architecture_baseline_refs:
      - "projects/task-management/README.md"
      - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
      - "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
      - "projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md"
      - "projects/task-management/design/architecture/v0.1/PHASE3_2_ARCHITECTURE_REVIEW_AND_ACCEPTANCE.md"
      - "projects/task-management/design/ux/v0.1/PHASE3_1_UX_DESIGN_REVIEW_AND_ACCEPTANCE.md"
      - "docs/continuity/BOOTSTRAP.md"
      - "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md"
    recovery_point:
      kind: git_commit
      reference: "main@400b8d5916bc66759597395905dfa2e153aca18b"
      verified: true

intent:
  objective: >-
    Make BVCTM independently recoverable from project-owned GitHub records
    when a GAIS session reaches quota or another executor must continue the
    work. A new executor must identify repository baseline, project purpose,
    approved product/design/governance baselines, active Task Contract, task
    and prompt status, evidence, external-system limitations, writer ownership,
    and exactly one next permitted action without relying on previous chat.
  rationale: >-
    Contract Revision 2 is APPROVED on main, but the repository validator
    run by the Human Owner on 2026-11-07 reported that AC-009 and AC-011
    require evidence level 2 while their linked required checks provide only
    level 1. Revision 3 corrects this mismatch without expanding the exact
    13-path scope: AC-009 is aligned to the handoff-directory instructions
    deliverable when no real handoff has occurred; AC-011 gains an explicit
    required level-2 VCS changed-file inventory check. Revision 3 remains
    PROPOSED until the Human Owner reviews and approves the revised criteria
    and verification checks.
  expected_outcome: >-
    One current BVCTM Project State, one Source Manifest, one append-only
    Handoff Log, one Task Execution Register, and one Evidence Index describe
    the same verified project checkpoint. A single copy-ready prompt in
    00_BVC_PROJECT_CONTINUITY.md enables any authorized executor to recover
    from live GitHub records. Actual worker handoffs are stored as individual
    YAML records under continuity/handoffs/ using the Global Worker Handoff
    schema and template. GAIS-to-DeepSeek recovery never assumes uncommitted
    or in-memory GAIS work is visible to DeepSeek.
  business_or_user_value: >-
    BVCTM becomes a practical reference project for model-independent,
    AI-assisted engineering continuity while remaining a beginner-friendly
    Vibe Coding learning project with clear separation between public lessons
    and private project governance.

risk:
  level: R1
  policy_ref: >-
    projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md
    — Sections 3, 4.1, 7 and 8. Header remains publication pending; effective
    date is upon controlled merge. Human Owner confirmed R1 on 2026-11-07.
    Revision 3 requires separate approval.
  rationale: >-
    The planned changes are bounded documentation, continuity metadata,
    registers, and validation-plan updates. No application source, product
    behavior, database, identity, security control, dependency, financial
    formula, deployment, or production resource is changed. All changes are
    reversible through reviewed Git commits. Because Project State and
    execution evidence are governance-sensitive records, exact paths,
    independent review, schema validation, and Owner acceptance are required.
  impact_factors:
    - other
  reversibility: EASY
  risk_owner: "Product Owner / Human Owner"

