learning_outcome:
  - "Explain React in-memory state versus browser-local persistence."
  - "Save the B1 title-only task list in the current browser profile."
  - "Load valid saved tasks after a normal reload in the same app origin/profile."
  - "Understand storage limitations and exact DR-005 disclosure."
  - "Observe truthful malformed-data and browser-storage error handling."

storage:
  provider: "Browser localStorage"
  key: "bvc-task-management:workspace:v1"
  envelope:
    format: "bvc-task-management-workspace"
    formatVersion: 1
    sourceMode: "browser"
    workspaceId: "<stable UUID generated once on first successful persistence>"
    data:
      projects: []
      tasks:
        - id: "<UUID generated for each new task>"
          title: "<non-empty trimmed task title>"
      checklistItems: []
      settings: {}
      appliedStarterKits: []
  rules:
    - "One key only; never split workspace data across multiple keys."
    - "Do not write an empty default workspace on mount."
    - "Read and validate before enabling writes."
    - "Use crypto.randomUUID() for workspace and task IDs; if unavailable, stop."
    - "Build the complete next envelope, serialize, call setItem once, then update React state and clear input only after success."
    - "On write failure preserve previous tasks and title input; never show a false saved state."
    - "On malformed/unsupported data preserve the exact stored value and disable writes."
    - "Do not silently fall back to sessionStorage or memory while claiming persistence."
    - "Cross-tab synchronization is out of scope."
    - "No backup, export/import, restore or file generation in B2."

dr_005:
  status: "APPROVED"
  decision_register: "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
  copy: |
    Where your tasks are stored

    In Beginner mode, your tasks are stored in this browser on this device. They do not automatically sync to other browsers or devices.

    Clearing this site's browser data may delete your tasks.

    Browser storage is not a separate backup. You will learn to export a JSON backup in a later lesson.

    Do not enter passwords, API keys, or sensitive information in this learning app.
  action: "Got it — continue"
  acknowledgement_state: "Component memory only for current page session; no extra storage key."
  new_workspace: "Require acknowledgement before first persisted task."
  existing_valid_workspace: "Show the disclosure as a readable non-blocking notice/control."

