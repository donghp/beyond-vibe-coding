contract_version: "0.1.0"
contract_id: "BVC-TM-TC-006"
revision: 2
status: DRAFT_NOT_APPROVED
created_at: "2026-11-24"

task:
  id: "BVC-TM-P3.3-006"
  title: "PHASE C1 — MY DAY: PRODUCT DECISION AND IMPLEMENTATION READINESS"
  objective: >-
    Prepare a decision-complete, evidence-linked C1 readiness package.
    Confirm the approved DR-001, DR-002 and DR-017 outcomes, specify a
    backward-compatible evolution of the accepted B2 Beginner workspace,
    define the C1 date/focus semantics for Owner review, and prepare a
    separate bounded implementation Contract proposal. This is a
    documentation-only task and does not authorize GAIS source changes.
  parent_task_id: "BVC-TM-P3.3-005"
  requested_by: "Human Owner's explicit Phase C acceleration instruction and confirmation of Project Understanding Review on 2026-11-24"
  risk_level: R1

project:
  project_id: "BVC-TASK-MANAGEMENT"
  repository:
    url: "https://github.com/donghp/beyond-vibe-coding"
    default_branch: "main"
  baseline:
    source_commit: "a586d4fa47af2fb83330667af5577a0ff1db0db5"
    source_branch: "main"
    baseline_verified: true
    baseline_note: "Live main HEAD verified after PR #84 merged; this Contract remains a draft proposal."
    architecture_baseline_refs:
      - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
      - "projects/task-management/design/architecture/v0.1/PHASE3_2_ARCHITECTURE_REVIEW_AND_ACCEPTANCE.md"
      - "projects/task-management/design/architecture/v0.1/BVC_TASK_MANAGEMENT_DATA_MODEL_V0.1.md"
      - "projects/task-management/design/ux/v0.1/BVC_TASK_MANAGEMENT_USER_JOURNEY_AND_NAVIGATION_V0.1.md"
      - "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
      - "practical-labs/bvc-task-management/CURRICULUM_MAP_V0.2.md"

intent:
  objective: >-
    Convert C1 — My Day into an implementation-ready proposal while preserving
    existing B2 browser data, approved Product/UX decisions and the Beginner
    learning boundary.
  expected_outcome: >-
    A revised C1 brief records the approved decisions and proposes testable
    task/date/focus/timezone semantics and a recoverable v1-to-v2 workspace
    migration. A separate R4 C1 implementation Contract #007 is prepared as
    a draft for Owner review. No implementation authority is created.
  business_or_user_value: >-
    Reduce ambiguity before implementation, preserve learners' saved tasks,
    and make the C1 change testable without expanding into C2 or cloud features.

risk:
  level: R1
  rationale: >-
    This Contract covers documentation and draft engineering proposals only.
    No application source, browser runtime data, database schema, external
    service or accepted architecture baseline is changed.
  reversibility: EASY
  risk_owner: "Human Owner / Product Owner"

scope:
  mode: "DOCUMENTATION_AND_PROPOSAL_PREPARATION"
  allowed_changes:
    create:
      - "projects/task-management/phase3.3/task-contracts/BVC-TM-P3.3-007_TASK_CONTRACT_V0.1.yaml"
    modify:
      - "projects/task-management/phase3.3/task-contracts/BVC-TM-P3.3-006_TASK_CONTRACT_V0.1.yaml"
      - "practical-labs/bvc-task-management/phase-c/C1_MY_DAY_DECISION_BRIEF_V0.1.md"
      - "practical-labs/bvc-task-management/phase-c/README.md"
      - "practical-labs/bvc-task-management/LESSON_STATUS_REGISTER_V0.2.md"
      - "projects/task-management/continuity/PROJECT_STATE.json"
      - "projects/task-management/continuity/registers/TASK_EXECUTION_REGISTER.yaml"
      - "projects/task-management/continuity/SOURCE_MANIFEST.csv"
    delete: []
  change_budget:
    max_changed_files: 8
    max_created_files: 1
    max_modified_files: 7
    max_deleted_files: 0
    max_binary_files: 0
    max_total_diff_lines: 1100
  forbidden_changes:
    - "Any GAIS application source, including app/page.tsx."
    - "Any live browser storage, task data or runtime application state."
    - "Changing the approved outcomes or status of DR-001, DR-002 or DR-017."
    - "Changing Product Definition v0.2.0 or the accepted Phase 3.2 Architecture/Data Model baselines."
    - "Allocating or publishing Prompt #0006."
    - "Executing, authorizing or claiming acceptance of Contract #007."
    - "Dependencies, lockfiles, configuration, routes, APIs, databases, Auth, RLS, cloud sync or external services."
  scope_expansion_allowed: false
  scope_expansion_policy: "STOP_AND_REQUEST_APPROVAL"

required_context:
  - reference: "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
    purpose: "FR-002, FR-006, FR-010, AC-006, My Day order and quick-task defaults."
    authority: "PRODUCT_OWNER_APPROVED"
    required: true
  - reference: "projects/task-management/design/architecture/v0.1/BVC_TASK_MANAGEMENT_DATA_MODEL_V0.1.md"
    purpose: "Task fields, date-only semantics, IANA timezone and versioned workspace principles."
    authority: "PHASE_3_2_ACCEPTED_DESIGN"
    required: true
  - reference: "projects/task-management/design/ux/v0.1/BVC_TASK_MANAGEMENT_USER_JOURNEY_AND_NAVIGATION_V0.1.md"
    purpose: "My Day task-placement and no-duplicate rules."
    authority: "REFERENCE; FORMAL_PHASE_3_1_ACCEPTANCE_OPEN"
    required: true
  - reference: "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
    purpose: "Canonical approved outcomes for DR-001, DR-002 and DR-017."
    authority: "CANONICAL; ALL_THREE_APPROVED_2026-11-24"
    required: true
  - reference: "projects/task-management/phase3.3/task-contracts/BVC-TM-P3.3-005_TASK_CONTRACT_V0.1.json"
    purpose: "Existing B2 v1 Local Storage key, envelope, validation and write-order boundary."
    authority: "APPROVED_REVISION_1"
    required: true
  - reference: "practical-labs/bvc-task-management/phase-c/C1_MY_DAY_DECISION_BRIEF_V0.1.md"
    purpose: "Decision-complete C1 data-compatibility and behavior proposal."
    authority: "PROPOSED; OWNER_REVIEW_REQUIRED"
    required: true

dependencies:
  - reference: "Phase B — B1 through B4"
    relationship: "COMPLETED_FIRST"
    reason: "Human Owner accepted and closed Phase B on 2026-11-24 with known evidence limitations."
  - reference: "DR-001"
    relationship: "OWNER_DECISION_APPROVED"
    reason: "Next 7 calendar days; define an explicit, testable date boundary."
  - reference: "DR-002"
    relationship: "OWNER_DECISION_APPROVED"
    reason: "Focus is scoped to the current local calendar date and expires at the next local day."
  - reference: "DR-017"
    relationship: "OWNER_DECISION_APPROVED"
    reason: "Detect browser IANA timezone on first use and allow user correction."
  - reference: "DR-020"
    relationship: "OWNER_DECISION_APPROVED"
    reason: "Supplemental Unscheduled section approved for active tasks without due date and without Focus active today."
  - reference: "B2 workspace formatVersion 1"
    relationship: "COMPATIBILITY_REVIEW_REQUIRED"
    reason: "Preserve existing workspaceId, task IDs and titles while introducing C1 fields."

expected_outputs:
  - id: "OUT-001"
    kind: "DOCUMENT"
    path: "practical-labs/bvc-task-management/phase-c/C1_MY_DAY_DECISION_BRIEF_V0.1.md"
    description: "C1 requirements, approved decisions, data migration proposal, date/focus/timezone semantics and acceptance outline."
    required: true
  - id: "OUT-002"
    kind: "DECISION_TRACE"
    description: "Verify that DR-001, DR-002 and DR-017 are already Owner-approved and canonical; do not reopen or reapprove them."
    required: true
  - id: "OUT-003"
    kind: "IMPLEMENTATION_CONTRACT_PROPOSAL"
    path: "projects/task-management/phase3.3/task-contracts/BVC-TM-P3.3-007_TASK_CONTRACT_V0.1.yaml"
    description: "A separate R4 implementation Contract draft with exact app scope, v1-to-v2 migration, recovery controls, date/focus rules, explicit legacy-task visibility decision, acceptance criteria and Evidence Level 3/4 checks."
    required: true

acceptance_criteria:
  - id: "AC-001"
    statement: "C1 maps Product Definition v0.2.0 FR-010 / AC-006 to the canonical My Day order and no-duplicate UX placement rules."
    required: true
  - id: "AC-002"
    statement: "DR-001, DR-002 and DR-017 are accurately recorded as Owner-approved on 2026-11-24; no stale claim says they are pending."
    required: true
  - id: "AC-003"
    statement: "The compatibility proposal preserves B2 formatVersion 1 workspaceId, task IDs and titles and defines validation, recovery and non-destructive migration behavior."
    required: true
  - id: "AC-004"
    statement: "Date-only due_date/focus_date, selected IANA timezone, task defaults and C1/C2 boundaries are explicit and traceable to approved product/design sources."
    required: true
  - id: "AC-005"
    statement: "A separate bounded R4 implementation Contract #007 is prepared as DRAFT_NOT_APPROVED, with no execution authorization."
    required: true
  - id: "AC-006"
    statement: "Project State, Task Execution Register, Source Manifest and Lesson Status Register contain no contradictory C1 decision or publication status."
    required: true
  - id: "AC-007"
    statement: "No GAIS source, runtime data, Prompt #0006, Product/UX decision status or accepted architecture baseline is changed."
    required: true
  - id: "AC-008"
    statement: "The Human Owner reviews this readiness proposal and separately reviews/approves Contract #007 before any C1 implementation."
    required: true

verification:
  required: true
  checks:
    - id: "VC-001"
      kind: "PRODUCT_TRACEABILITY_REVIEW"
      description: "Verify FR-010 / AC-006, section order and no-duplicate rules against Product Definition and UX sources."
      required: true
    - id: "VC-002"
      kind: "OWNER_DECISION_TRACE"
      description: "Verify the exact canonical DR-001, DR-002 and DR-017 outcomes on main."
      required: true
    - id: "VC-003"
      kind: "DATA_COMPATIBILITY_REVIEW"
      description: "Review v1-to-v2 mapping, task-data preservation, error handling and recovery against B2 Contract #005 and the accepted Data Model."
      required: true
    - id: "VC-004"
      kind: "CONTRACT_SCOPE_REVIEW"
      description: "Verify Contract #007 is a separate R4 proposal with exact path, change budget, stop conditions, persisted-data evidence and an explicit legacy-task visibility decision dependency."
      required: true
    - id: "VC-005"
      kind: "CONTINUITY_SYNC_REVIEW"
      description: "Check Project State, task register, Source Manifest and Lesson Status consistency; preserve draft and authorization semantics."
      required: true

authority:
  requested_by: "Human Owner's explicit Phase C acceleration instruction, 2026-11-24"
  authorized_by: "NOT_GRANTED — this revision remains a proposal for Owner review"
  authorization_status: "DRAFT_ONLY; NOT_APPROVED; NOT_AUTHORIZED_FOR_EXECUTION"
  execution_rule: >-
    This readiness Contract is a proposal only. Publishing or merging it
    does not approve the Contract or authorize GAIS edits. Contract #007 is
    a separate implementation proposal and requires its own explicit Owner
    approval and a separate execution authorization. Prompt #0006 remains
    NOT_ALLOCATED until Contract #007 is approved and the required authority
    and live preflight gates are satisfied.
  executor:
    class: "DOCUMENTATION_AND_PROPOSAL_PREPARATION"
    proposed_owner: "ChatGPT prepares and reconciles the bounded readiness proposal; Human Owner / Product Owner decides."
    gais_executor: "NOT_APPLICABLE_FOR_THIS_READINESS_TASK"

prompt:
  next_prompt_id: "BVCTM-PROMPT-0006"
  allocation_status: "NOT_ALLOCATED"
  reason: "Contract #007 is a separate implementation proposal and remains DRAFT_NOT_APPROVED. Do not allocate Prompt #0006 until Contract #007 is approved and the Human Owner separately authorizes execution."
