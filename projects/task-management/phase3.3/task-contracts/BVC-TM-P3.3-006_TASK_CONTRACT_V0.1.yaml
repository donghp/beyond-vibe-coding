      kind: "git_snapshot"
      reference: "main@100c8cc89de42329fe99e484be70e9441efe144e"
      verified: true

intent:
  objective: >-
    Convert C1 — My Day from a curriculum topic into a decision-complete,
    testable implementation proposal while preserving the existing Beginner
    workspace and the accepted Phase 3.2 architecture.
  rationale: >-
    Phase B has been closed by the Human Owner. The current curriculum defines
    C1 as My Day. Date horizon, Focus lifetime and timezone behavior were explicitly
    approved by the Human Owner on 2026-11-24, and the accepted B2 task record
    contains only id and title. These dependencies must be resolved before
    asking a beginner's GAIS application to implement date-aware behavior.
  expected_outcome: >-
    A reviewed C1 decision brief maps FR-010, AC-006 and the UX placement rules;
    DR-001, DR-002 and DR-017 are recorded as approved; task-field and
    workspace-version compatibility are specified; a separate bounded
    implementation Contract can then be prepared.
  business_or_user_value: >-
    Prevent ambiguous date/focus behavior, protect existing saved tasks and
    make the first Phase C learner exercise understandable and verifiable.

risk:
  level: R1
  rationale: >-
    This proposed task is documentation and product-decision preparation only.
    It does not modify the GAIS application, browser data, schema or external
    services. Any later implementation is a separate authorization.
  reversibility: EASY
  risk_owner: "Human Owner / Product Owner"

scope:
  mode: "DOCUMENTATION_AND_DECISION_PREPARATION"
  allowed_changes:
    create:
      - "practical-labs/bvc-task-management/phase-c/C1_MY_DAY_DECISION_BRIEF_V0.1.md"
    modify: []
    delete: []
  forbidden_changes:
    - "Any GAIS application source, including app/page.tsx."
    - "Any runtime browser storage or task data."
    - "Changing the Owner-approved DR-001, DR-002 and DR-017 outcomes recorded in the canonical Product/UX Decision Register."
    - "The accepted Phase 3.2 Architecture baseline or Product Definition v0.2.0."
    - "Dependencies, lockfiles, configuration, routes, APIs, databases, Auth, RLS, cloud sync or external services."
    - "A GAIS implementation prompt or Prompt #0006 allocation before this Contract and the required product decisions are approved."
  scope_expansion_allowed: false
  scope_expansion_policy: "STOP_AND_REQUEST_APPROVAL"

required_context:
  - reference: "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
    purpose: "Current Product Owner-approved baseline; especially §7.2, FR-010 and AC-006."
    authority: "APPROVED"
    required: true
  - reference: "projects/task-management/design/ux/v0.1/BVC_TASK_MANAGEMENT_USER_JOURNEY_AND_NAVIGATION_V0.1.md"
    purpose: "My Day order, non-duplication and task-placement rules."
    authority: "REFERENCE; FORMAL PHASE 3.1 ACCEPTANCE REMAINS OPEN"
    required: true
  - reference: "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
    purpose: "Canonical OPEN/APPROVED states for DR-001, DR-002 and DR-017."
    authority: "CANONICAL; DR-001, DR-002 and DR-017 APPROVED BY OWNER 2026-11-24"
    required: true
  - reference: "projects/task-management/continuity/PROJECT_STATE.json"
    purpose: "Phase B Owner closeout, current project state and B2 workspace history."
    authority: "CANONICAL_AFTER_OWNER_REVIEWED_MERGE"
    required: true
  - reference: "practical-labs/bvc-task-management/phase-c/README.md"
    purpose: "C1–C6 learner sequence aligned to Curriculum Map v0.2."
    authority: "CANONICAL_LEARNING_MAP"
    required: true

dependencies:
  - reference: "Phase B — B1 through B4"
    relationship: "MUST_COMPLETE_FIRST"
    reason: "Human Owner explicitly accepted and closed all four Phase B lessons on 2026-11-24."
  - reference: "DR-001 — Upcoming horizon"
    relationship: "OWNER_DECISION_APPROVED"
    reason: "Owner approved the next 7 calendar days on 2026-11-24; C1 Contract must define date boundaries and tests."
  - reference: "DR-002 — Today's Focus lifetime/reset"
    relationship: "OWNER_DECISION_APPROVED"
    reason: "Owner approved a Focus marker scoped to the current local calendar date and automatic expiry at the next local calendar day on 2026-11-24."
  - reference: "DR-017 — Timezone source and editing"
    relationship: "OWNER_DECISION_APPROVED"
    reason: "Owner approved browser IANA timezone detection on first use with user correction on 2026-11-24; C1 Contract must define persistence and fallback behavior."
  - reference: "B2 Beginner workspace formatVersion 1"
    relationship: "COMPATIBILITY_REVIEW_REQUIRED"
    reason: "Existing tasks contain id/title only; C1 must preserve saved tasks and define a safe path for any new date/focus/status fields."

expected_outputs:
  - id: "OUT-001"
    kind: "DOCUMENT"
    path: "practical-labs/bvc-task-management/phase-c/C1_MY_DAY_DECISION_BRIEF_V0.1.md"
    description: "Decision options, canonical My Day behavior, data compatibility questions, implementation dependencies and acceptance outline."
    required: true
  - id: "OUT-002"
    kind: "DECISION_INPUT"
    description: "Explicit Product Owner decisions for DR-001, DR-002 and DR-017. This Contract cannot approve those decisions on the Owner's behalf."
    required: true
  - id: "OUT-003"
    kind: "IMPLEMENTATION_PROPOSAL"
    description: "A separate bounded C1 implementation scope with exact task fields, workspace compatibility/migration approach, allowed files, diff budget, stop conditions, acceptance criteria and test evidence."
    required: true

acceptance_criteria:
  - id: "AC-001"
    statement: "C1 scope maps Product Definition v0.2.0 FR-010 and AC-006 to the UX My Day section order and no-duplicate placement rules."
    required: true
  - id: "AC-002"
    statement: "DR-001, DR-002 and DR-017 are explicitly resolved by the Product Owner before dependent implementation is authorized."
    required: true
  - id: "AC-003"
    statement: "The proposal defines how existing B2 id/title task records remain readable and are safely evolved if C1 adds due-date, focus or status fields."
    required: true
  - id: "AC-004"
    statement: "Completed-task exclusion and task-status behavior are coordinated with C2 without silently expanding C1."
    required: true
  - id: "AC-005"
    statement: "The C1 implementation proposal specifies observable Preview results, date-boundary tests, duplicate-prevention checks and browser-storage regression evidence."
    required: true
  - id: "AC-006"
    statement: "No GAIS source, runtime data, Product/UX decision status or architecture baseline is changed by this preparation task."
    required: true
  - id: "AC-007"
    statement: "Human Owner / Product Owner reviews the decision brief and separately approves the implementation Contract before any GAIS write-capable prompt is issued."
    required: true

verification:
  required: true
  checks:
    - id: "VC-001"
      kind: "DOCUMENT_REVIEW"
      description: "Verify Product Definition FR-010 / AC-006 mapping and the My Day ordering/placement rules."
      required: true
    - id: "VC-002"
      kind: "DECISION_REVIEW"
      description: "Verify canonical DR-001, DR-002 and DR-017 outcomes are explicitly Owner-approved; proposed defaults alone do not pass."
      required: true
    - id: "VC-003"
      kind: "DATA_COMPATIBILITY_REVIEW"
      description: "Verify the proposal preserves B2 formatVersion 1 records or defines a reviewed, reversible migration path."
      required: true
    - id: "VC-004"
      kind: "SCOPE_REVIEW"
      description: "Confirm the preparation output does not modify GAIS code or runtime data and that later implementation has its own Contract."
      required: true

authority:
  requested_by: "Human Owner's Phase C transition decision, 2026-11-24"
  authorized_by: "NOT_GRANTED"
  authorization_status: "DRAFT_ONLY; NOT_APPROVED; NOT_AUTHORIZED_FOR_EXECUTION"
  execution_rule: >-
    This file is a Contract proposal only. Merging the PR that publishes this
    draft does not approve the Contract, resolve Product/UX decisions or
    authorize GAIS edits. Human Owner / Product Owner must explicitly approve
    the Contract and the applicable decisions before execution. Any later
    write-capable GAIS task requires an explicit authorization and a fresh
    live-source preflight.
  executor:
    class: "DOCUMENTATION_AND_PRODUCT_DECISION_PREPARATION"
    proposed_owner: "ChatGPT prepares the bounded decision analysis; Human Owner / Product Owner decides."
    gais_executor: "NOT_APPLICABLE_FOR_THIS_READINESS_TASK"

