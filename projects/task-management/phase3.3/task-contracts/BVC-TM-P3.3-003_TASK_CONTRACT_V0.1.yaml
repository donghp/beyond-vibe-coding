contract_version: "0.1.0"
contract_id: "BVC-TM-TC-003"
revision: 1
status: APPROVED
created_at: "2026-11-05T17:48:00+07:00"

task:
  id: "BVC-TM-P3.3-003"
  title: "GAIS BLANK WEB APP SCAFFOLD INSPECTION AND INVENTORY"
  objective: >-
    Create one isolated, non-production blank web application in Google AI
    Studio Build mode, inspect the actual generated scaffold and preview, and
    record only observed framework, runtime, dependencies, scripts, build
    configuration, routing, environment-variable names, export behavior, and
    limitations. Do not implement BVC Task Management features or connect the
    app to an existing GitHub repository.
  requested_by: "Human Owner / Product Owner"
  parent_task_id: "BVC-TM-P3.3-001"

project:
  project_id: "BVC-TASK-MANAGEMENT"
  repository:
    url: "https://github.com/donghp/beyond-vibe-coding"
    default_branch: "main"
  baseline:
    source_commit: "bdbd226ed8bd1402999d3e16f5961072a4f882b1"
    working_tree_status: CLEAN
    architecture_baseline_refs:
      - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
      - "projects/task-management/design/architecture/v0.1/PHASE3_2_ARCHITECTURE_REVIEW_AND_ACCEPTANCE.md"
      - "projects/task-management/design/architecture/v0.1/BVC_TASK_MANAGEMENT_DEVELOPMENT_TESTING_DEPLOYMENT_V0.1.md"
      - "projects/task-management/design/architecture/v0.1/BVC_TASK_MANAGEMENT_SECURITY_AND_ENVIRONMENT_V0.1.md"
      - "projects/task-management/design/ux/v0.1/PHASE3_1_UX_DESIGN_REVIEW_AND_ACCEPTANCE.md"
    recovery_point:
      kind: git_commit
      reference: "main@bdbd226ed8bd1402999d3e16f5961072a4f882b1"
      verified: true

intent:
  objective: >-
    Replace assumptions about the Google AI Studio generated application
    scaffold with a small evidence-backed inventory from one isolated blank
    web app. The inspection will establish the actual toolchain and export
    characteristics needed to write accurate Beginner instructions and plan
    a separately authorized first vertical-slice implementation.
  rationale: >-
    The accepted Phase 3.2 architecture baseline and the current project
    README explicitly defer framework, runtime, dependencies, build settings,
    and deployment compatibility until the actual GAIS-exported scaffold is
    inspected. Task #001 established the Beginner readiness blueprint; Task
    #002 synchronized the Human Owner acceptance metadata. Neither task
    created or inspected a GAIS app.
  expected_outcome: >-
    One isolated blank GAIS web app is created and inspected. The repository
    receives an evidence-backed Markdown report and YAML scaffold inventory.
    Unknown or unobservable fields are explicitly marked UNKNOWN or
    NOT_VERIFIED rather than inferred. No BVC product feature is implemented.
  business_or_user_value: >-
    Provide verified technical facts for future Beginner lessons and a safe,
    repeatable handoff from GAIS Build mode to later source review, without
    prematurely selecting a framework, build command, hosting provider, or
    implementation approach.

risk:
  level: R2
  policy_ref: >-
    BVC-TM-RISK-001 v0.1.0 — project-specific risk policy. The policy file on
    main records Product Owner approval but its header still says publication
    pending; this metadata inconsistency remains a governance finding and is
    not silently treated as resolved by this Contract.
  rationale: >-
    The task creates one isolated external app scaffold and performs a bounded
    preview/build inspection, then creates two documentation artifacts. It
    generates a multi-file app scaffold but does not modify an existing app,
    add product behavior, handle real user data, configure identity or access,
    provision a database, integrate external services, connect a repository,
    or deploy. The app is non-production and the action is reversible by
    abandoning the isolated test app. R2 controls are appropriate for this
    bounded scaffold-generation activity; any implementation or protected
    integration discovered to be necessary requires a new Contract.
  impact_factors:
    - other
  reversibility: EASY
  risk_owner: "Product Owner / Human Owner"

scope:
  mode: WRITE
  allowed_changes:
    create:
      - "projects/task-management/phase3.3/GAIS_SCAFFOLD_INSPECTION_REPORT_V0.1.md"
      - "projects/task-management/phase3.3/GAIS_SCAFFOLD_INVENTORY_V0.1.yaml"
    modify: []
    delete: []
  forbidden_paths:
    - "projects/task-management/README.md"
    - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
    - "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
    - "projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md"
    - "projects/task-management/phase3.3/task-contracts/BVC-TM-P3.3-001_TASK_CONTRACT_V0.1.yaml"
    - "projects/task-management/phase3.3/task-contracts/BVC-TM-P3.3-002_TASK_CONTRACT_V0.1.yaml"
    - "projects/task-management/phase3.3/BEGINNER_IMPLEMENTATION_READINESS_V0.1.md"
    - "projects/task-management/phase3.3/BEGINNER_CONTEXT_PACK_V0.1.yaml"
    - "projects/task-management/design/ux/v0.1/PHASE3_1_UX_DESIGN_REVIEW_AND_ACCEPTANCE.md"
    - "projects/task-management/design/architecture/v0.1/PHASE3_2_ARCHITECTURE_REVIEW_AND_ACCEPTANCE.md"
    - "specifications/v0.1/task-contract.schema.json"
    - "scripts/validate_task_contracts.py"
  forbidden_path_prefixes:
    - "application/"
    - "starter-kits/"
    - "examples/"
    - "specifications/"
    - "scripts/"
    - "tests/"
    - ".github/"
    - "projects/task-management/product/"
    - "projects/task-management/design/"
    - "projects/task-management/governance/"
  protected_resource_refs:
    - "Product Definition v0.2.0 — current Product Owner-approved product baseline"
    - "Phase 3.2 Architecture Design Baseline — accepted design only"
    - "Phase 3.1 UX Acceptance — remains OPEN"
    - "Phase 3 Product / UX Decision Register — DR-001 through DR-019 remain authoritative"
    - "BVC-TM-TC-001 Revision 3 — completed Task #001 scope"
    - "BVC-TM-TC-002 Revision 1 — approved metadata reconciliation scope"
    - "Five Phase 2 Core Specifications and their schemas, examples, validators, tests, and workflows"
  scope_expansion_allowed: false
  scope_expansion_policy: STOP_AND_REQUEST_APPROVAL
  discovery_outside_scope_allowed: true
  stop_if_out_of_scope_change_detected: true

constraints:
  - "Create exactly one new, isolated, non-production WEB application in the Human Owner's Google AI Studio Build workspace. Do not select the Android app type."
  - "Use the project label BVC-TM-P3.3-003-SCAFFOLD-INSPECTION if the UI permits a project name. Record the actual displayed name if the label field differs."
  - "Use one minimal scaffold-only prompt: Create a minimal blank web application for scaffold inspection. Display only the text 'BVC Task Management Scaffold Inspection'. Do not implement task management features, task forms, data persistence, authentication, database access, APIs, external integrations, or deployment."
  - "Do not add or implement the BVC first vertical slice in this task. The first vertical slice is a separate future implementation task."
  - "Inspect the actual UI controls and generated files. Record exact labels only when directly observed; if the UI differs from documentation, report the observed UI."
  - "Do not assume React, Node.js, Vite, npm, pnpm, yarn, a lockfile, build scripts, output directories, or routing behavior. Verify each from the actual project files or mark it UNKNOWN / NOT_VERIFIED."
  - "Inspect the generated code tree and, where export is available, download one ZIP copy for read-only inspection outside the repository, for example under %TEMP%\\BVC-TM-P3.3-003\\. Do not extract the ZIP into the BVC repository."
  - "Do not connect, import, link, or sync the GAIS app with donghp/beyond-vibe-coding or any other GitHub repository during this task."
  - "Do not push code from GAIS to GitHub. Do not create a GitHub repository for the GAIS app."
  - "Do not provision Supabase, PostgreSQL, Firebase, or another database. Do not configure Auth, RLS, API integrations, Cloud Run, hosting, or deployment."
  - "Do not create, reveal, copy, or record secret values, API-key values, tokens, credentials, or private account data. Environment-variable NAMES may be recorded; their values must never be included in screenshots, logs, report, or inventory."
  - "Use only a harmless placeholder page and synthetic text. Do not enter personal, customer, confidential, financial, or production data."
  - "Record build/preview results exactly as observed. A visible preview is not evidence of a production build, application correctness, persistence, security, or deployment readiness."
  - "Record every unknown as UNKNOWN or NOT_VERIFIED; do not infer a result from framework conventions or general Google documentation."
  - "Create only the two authorized report/inventory files in the BVC repository. Keep the exported app ZIP and any extracted files outside the repository."
  - "Do not modify or delete existing BVC repository files, product baselines, UX decisions, architecture records, specifications, scripts, tests, workflows, or application source."
  - "Do not change or resolve DR-001 through DR-019 or ODEC-001 through ODEC-008. DR-005 remains OPEN; Phase 3.1 UX Acceptance remains OPEN."
  - "Only the Human Owner operates the authenticated GAIS account and local file system. AI may analyze screenshots and files explicitly supplied by the Human Owner and prepare the report; AI has no direct GAIS account, GitHub write, commit, push, or merge authority."
  - "If the GAIS interface requires a paid service, external integration, secret, database, sign-in configuration, repository connection, deployment, or broader permission beyond this scope, stop and request a new Contract."

