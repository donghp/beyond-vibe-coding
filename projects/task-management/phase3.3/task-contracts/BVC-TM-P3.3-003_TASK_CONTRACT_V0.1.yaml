expected_outputs:
  - id: "OUT-001"
    kind: "REPORT"
    description: >-
      Evidence-backed Markdown report recording the GAIS Build/Preview journey,
      actual app type, UI controls observed, preview result, export outcome,
      framework/runtime/dependency findings, unresolved facts, security
      boundaries, evidence references, and handoff to the first implementation
      task.
    path: "projects/task-management/phase3.3/GAIS_SCAFFOLD_INSPECTION_REPORT_V0.1.md"
    required: true
  - id: "OUT-002"
    kind: "CONFIGURATION"
    description: >-
      Machine-readable YAML inventory of the actual generated scaffold files,
      manifest and lockfile observations, scripts, runtime, routing, output
      directory, environment-variable NAMES only, and explicit UNKNOWN or
      NOT_VERIFIED fields.
    path: "projects/task-management/phase3.3/GAIS_SCAFFOLD_INVENTORY_V0.1.yaml"
    required: true
  - id: "OUT-003"
    kind: "OTHER"
    description: >-
      One isolated, non-production blank Google AI Studio Build-mode WEB app
      and one read-only ZIP export stored outside the BVC repository when the
      platform makes export available. These are external/local evidence
      artifacts, not files authorized for commit to the BVC repository.
    required: true

acceptance_criteria:
  - id: "AC-001"
    statement: >-
      Exactly one new isolated blank WEB app is created in Google AI Studio
      Build mode using the authorized scaffold-only prompt; no Android app or
      unrelated app is created as part of this task.
    verification_method: "Human Owner screenshot and observed GAIS project/app name and type."
    required_evidence_level: 2
    required: true
  - id: "AC-002"
    statement: >-
      The app contains only a minimal placeholder page for scaffold inspection;
      it does not implement task management, task capture, persistence, user
      accounts, database integration, API features, external services, or
      deployment.
    verification_method: "Review the exact prompt, visible preview, and generated code tree."
    required_evidence_level: 2
    required: true
  - id: "AC-003"
    statement: >-
      The scaffold inventory records every observed file path and classifies
      files using evidence from the Code view or exported ZIP. No file or
      framework detail is inferred from convention.
    verification_method: "Compare inventory entries against screenshots and the read-only ZIP listing."
    required_evidence_level: 2
    required: true
  - id: "AC-004"
    statement: >-
      Frontend framework/version, server runtime, package manager, lockfile,
      scripts, build command, output directory, routing/rewrite configuration,
      and environment-variable NAMES are recorded from actual files or marked
      UNKNOWN/NOT_VERIFIED when absent or inaccessible. Secret values are never recorded.
    verification_method: "Inspect actual package manifests, lockfiles, config files, and relevant GAIS panels; cite the source file or screenshot for each fact."
    required_evidence_level: 2
    required: true
  - id: "AC-005"
    statement: >-
      Preview/build outcome is recorded exactly as observed, including error
      text and blockers. Preview success is not described as a production build,
      runtime acceptance, persistence verification, or deployment readiness.
    verification_method: "Human Owner screenshot of the actual preview and any visible build or error output."
    required_evidence_level: 2
    required: true
  - id: "AC-006"
    statement: >-
      No GitHub repository is connected, no source code is pushed, no secrets
      or real personal/customer data are exposed, and no database, Auth, RLS,
      external integration, hosting, or deployment is configured.
    verification_method: "Review the task activity record, screenshots, exported file set, and explicit Human Owner confirmation."
    required_evidence_level: 2
    required: true
  - id: "AC-007"
    statement: >-
      The Markdown report and YAML inventory are complete, mutually consistent,
      evidence-linked, and explicitly distinguish OBSERVED, INFERRED, UNKNOWN,
      and NOT_VERIFIED. Inference must never replace missing observation.
    verification_method: "Manual report review and YAML parsing."
    required_evidence_level: 2
    required: true
  - id: "AC-008"
    statement: >-
      Repository changes consist of exactly the two authorized CREATE files,
      with zero MODIFY, zero DELETE, zero binary files, and no application source
      or unrelated changes, within the approved Change Budget.
    verification_method: "VCS-derived changed-file inventory and repository Contract Validator VC-007."
    required_evidence_level: 2
    required: true

verification:
  required: true
  minimum_evidence_level: 2
  checks:
    - id: "VC-001"
      kind: "MANUAL_REVIEW"
      description: "Verify one isolated GAIS WEB app was created with the authorized placeholder-only prompt and no unrelated app resource was created."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-001", "AC-002"]
    - id: "VC-002"
      kind: "MANUAL_REVIEW"
      description: "Compare the scaffold inventory with the actual Code view and the exported ZIP listing, where export is available."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-003"]
    - id: "VC-003"
      kind: "STATIC_ANALYSIS"
      description: "Inspect actual manifests, lockfiles, runtime/configuration files, scripts, output settings, routing, and environment-variable names; record UNKNOWN where evidence is absent."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-004"]
    - id: "VC-004"
      kind: "REAL_WORLD_CHECK"
      description: "Open the actual GAIS Preview once and record the visible outcome or exact error; do not claim production or persistence verification."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-005"]
    - id: "VC-005"
      kind: "SECURITY_REVIEW"
      description: "Verify no secret values, real personal/customer data, GitHub link, database, Auth, RLS, external integration, hosting, or deployment entered the task scope."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-006"]
    - id: "VC-006"
      kind: "STATIC_ANALYSIS"
      description: "Parse the scaffold inventory YAML and run Markdown whitespace checks on the report."
      command: "python -c \"import yaml; yaml.safe_load(open('projects/task-management/phase3.3/GAIS_SCAFFOLD_INVENTORY_V0.1.yaml', encoding='utf-8')); print('PASS: GAIS Scaffold Inventory')\""
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-007"]
    - id: "VC-007"
      kind: "SYSTEM_CHECK"
      description: "Use a VCS-derived changed-files JSON inventory and the repository validator to verify exactly two CREATE paths, zero MODIFY, zero DELETE, zero binary files, and Change Budget compliance."
      command: "python scripts/validate_task_contracts.py <contract-yaml-path> --changed-files-json <vcs-diff-inventory.json>"
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-008"]
  known_verification_limits:
    - "This task does not implement the BVC Task Management first vertical slice."
    - "This task does not test browser localStorage persistence, CRUD, import/export behavior, or task workflows."
    - "This task does not provision Supabase/PostgreSQL or configure Auth/RLS."
    - "This task does not perform responsive, accessibility, security penetration, integration, end-to-end, or production tests."
    - "This task does not select or validate a hosting provider or deploy the app."
    - "If GAIS ZIP export or a file detail is unavailable, record the limitation and mark the affected fields NOT_VERIFIED."

change_budget:
  max_changed_files: 2
  max_created_files: 2
  max_modified_files: 0
  max_deleted_files: 0
  max_total_diff_lines: 1500
  max_binary_files: 0
  allow_dependency_changes: false
  allow_lockfile_changes: false
  allow_database_schema_changes: false
  allow_financial_formula_changes: false
  allow_authentication_changes: false
  allow_architecture_changes: false

authority:
  policy_ref: >-
    BVC-TM-RISK-001 v0.1.0 — project-specific R0-R5 risk policy. Its Product
    Owner approval is recorded in the policy file; publication-pending header
    metadata remains a governance finding and must not be silently rewritten.
  requested_by: "Human Owner / Product Owner"
  authorized_by: "Human Owner / Product Owner"
  authorization_reference: >-
    Human Owner explicitly approved BVC-TM-TC-003 Revision 1 on 2026-11-05.
    This approval authorizes only the exact scope, constraints, and change
    budget defined in this Contract. Any scope expansion requires a new or
    revised Contract and explicit approval.
  executor:
    class: HYBRID
    identifier: "Human Owner creates the GAIS app, captures screenshots and exports locally; AI guides prompts and reviews evidence only, with no direct GAIS access or GitHub write/commit/push/merge authority."
    capability_requirements:
      - "Read the current main baseline and approved Phase 3.2 design records."
      - "Guide the Human Owner through one blank web-app scaffold creation."
      - "Inspect screenshots and files explicitly supplied by the Human Owner."
      - "Record only facts evidenced by the actual scaffold or UI."
      - "Create only the two authorized documentation outputs through the Human Owner's local workflow."
      - "Validate YAML, Markdown, and VCS-derived scope inventory."
  permitted_actions:
    - read
    - inspect
    - run_analysis
    - create
    - run_build
    - run_tests
  human_approval:
    required: true
    status: APPROVED
    approver_role: "Human Owner / Product Owner"
    approval_reference: "Human Owner explicitly approved BVC-TM-TC-003 Revision 1 in conversation on 2026-11-05."
    rationale: "R2 scaffold generation creates one isolated external app resource. The Human Owner has explicitly approved the exact scope, constraints, and Change Budget in this revision."

stopping_conditions:
  - scope_expansion_required
  - protected_resource_detected
  - change_budget_exceeded
  - baseline_or_recovery_point_unverified
  - required_context_missing_or_conflicting
  - authorization_missing_or_revoked
  - verification_failed_or_insufficient
  - unexpected_file_change
  - risk_escalation
  - security_or_data_exposure
  - working_tree_changed_unexpectedly
  - other

retry_policy:
  max_repair_attempts: 1
  additional_attempts_require_approval: true
  retry_rationale: >-
    One bounded retry may correct an inspection recording or report-formatting
    issue without creating a second GAIS app. A failed initial scaffold creation,
    repeated generation that materially changes the scaffold, or any request to
    add functionality requires Human Owner review and a new or revised Contract.

reporting:
  required_items:
    - task_and_run_identifiers
    - actual_file_inventory
    - created_modified_deleted_breakdown
    - scope_integrity_result
    - change_budget_result
    - verification_results
    - evidence_references
    - unresolved_findings
    - limitations
    - next_action
    - checkpoint_reference
    - handoff_reference
  out_of_scope_findings_must_be_recorded: true

continuity:
  checkpoint_required: true
  handoff_on_interruption: true
  recovery_instructions_ref: "specifications/v0.1/task-contract.md#4.13-reporting-and-continuity"
