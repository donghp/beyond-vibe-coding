  additional_attempts_require_approval: true
  retry_rationale: >-
    One bounded repair may correct a defect within app/page.tsx. Any need for
    another file, dependency, configuration, persistence, API, or broader UI
    change requires stopping and obtaining a new or revised Contract.

reporting:
