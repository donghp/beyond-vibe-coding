  - reference: "DR-005 first-use storage disclosure"
    relationship: INFORMATIONAL
    reason: "B1 is in-memory only and shows no persistence or first-use storage disclosure. DR-005 remains OPEN and must be resolved before B2 onboarding/storage implementation."
  - reference: "DR-014 Beginner browser persistence"
    relationship: INFORMATIONAL
    reason: "Accepted for design only; its implementation and runtime verification belong to B2, not B1."

expected_outputs:
  - id: "OUT-001"
    kind: "CODE"
    description: >-
      One modified GAIS source file app/page.tsx implementing the B1 title-only
      task form, in-memory task list, empty state, input trimming, and empty-title
      validation. No other source or configuration file may change.
    path: "app/page.tsx"
    required: true
  - id: "OUT-002"
    kind: "OTHER"
    description: >-
      Human Owner-captured GAIS Preview evidence showing the initial empty state,
      a successful task creation, rejection of empty/whitespace-only input, and
      the temporary in-memory behavior after refresh. These are external evidence
      artifacts and are not repository file outputs under this Contract.
    required: true

acceptance_criteria:
  - id: "AC-001"
    statement: "The Preview shows one clearly labelled task-title input and one Add task submit action; title is the only required task field."
    verification_method: "Inspect the actual GAIS Preview and form labels."
    required_evidence_level: 2
    required: true
  - id: "AC-002"
    statement: "Submitting a non-empty title after trimming leading/trailing whitespace creates exactly one visible list item containing the trimmed title."
    verification_method: "Enter a sample title such as Call the supplier and verify exactly one corresponding list item appears."
    required_evidence_level: 2
    required: true
  - id: "AC-003"
    statement: "Submitting an empty or whitespace-only title creates no task and shows the friendly validation message."
    verification_method: "Submit an empty field and a spaces-only value; verify the list is unchanged and the message is visible."
    required_evidence_level: 2
    required: true
  - id: "AC-004"
    statement: "After a successful task creation, the input is cleared and any prior validation message is cleared."
    verification_method: "Trigger a validation message, then submit a valid title and inspect the input and message."
    required_evidence_level: 2
    required: true
  - id: "AC-005"
    statement: "Multiple tasks can be added during the current page session and remain visible in insertion order."
    verification_method: "Add two distinct sample titles and verify both appear once in the order entered."
    required_evidence_level: 2
    required: true
  - id: "AC-006"
    statement: "The form supports keyboard submission with Enter and exposes a programmatically associated input label."
    verification_method: "Inspect semantic form/label source and submit a task using Enter in Preview."
    required_evidence_level: 2
    required: true
  - id: "AC-007"
    statement: "Tasks are held in page memory only; no browser persistence or external integration is implemented, and refresh resets the temporary list."
    verification_method: "Inspect app/page.tsx for state-only behavior and prohibited storage/API use, then refresh Preview and observe reset."
    required_evidence_level: 2
    required: true
  - id: "AC-008"
    statement: "The only changed GAIS source file is app/page.tsx; no dependency, lockfile, configuration, route, or unrelated file is changed."
    verification_method: "Review the actual GAIS Code/File Explorer change list or before/after source inventory."
    required_evidence_level: 2
    required: true
  - id: "AC-009"
    statement: "The Human Owner reviews and accepts the actual Preview behavior and evidence; an AI-generated completion statement alone is insufficient."
    verification_method: "Human Owner confirmation and supplied Preview screenshots or equivalent observable evidence."
    required_evidence_level: 2
    required: true

verification:
  required: true
  minimum_evidence_level: 2
  checks:
    - id: "VC-001"
      kind: "MANUAL_REVIEW"
      description: "Reconfirm GAIS project identity and compare the current app/page.tsx with the Owner-supplied source snapshot before editing."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-008"]
    - id: "VC-002"
      kind: "STATIC_ANALYSIS"
      description: "Review app/page.tsx and confirm the implementation uses in-memory component state only and introduces none of the forbidden APIs or imports."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-007", "AC-008"]
    - id: "VC-003"
      kind: "MANUAL_REVIEW"
      description: "Review the actual Code diff and confirm exactly app/page.tsx changed, with no package/configuration or unrelated changes."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-008"]
    - id: "VC-004"
      kind: "REAL_WORLD_CHECK"
      description: "Use GAIS Preview to add two sample tasks and verify that each appears exactly once in insertion order."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-001", "AC-002", "AC-005"]
    - id: "VC-005"
      kind: "REAL_WORLD_CHECK"
      description: "Use GAIS Preview to submit an empty title and a spaces-only title; verify both are rejected with a helpful message and no blank item."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-003", "AC-004"]
    - id: "VC-006"
      kind: "REAL_WORLD_CHECK"
      description: "Submit a valid title by pressing Enter and verify one item is created."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-006"]
    - id: "VC-007"
      kind: "REAL_WORLD_CHECK"
      description: "Refresh GAIS Preview and verify the B1 in-memory list resets. Record this as expected B1 behavior, not as a defect."
      evidence_level: 2
      required: true
      acceptance_criteria_refs: ["AC-007"]
  known_verification_limits:
    - "ChatGPT has no direct access to the Human Owner's authenticated GAIS session or local browser."
    - "No local npm/bun install, lint, unit test, build, production runtime, or deployment is claimed unless the Human Owner supplies actual output."
    - "The source ZIP contained a zero-byte bun.lock and a declared eslint-config-next/Next.js major-version mismatch; this task does not repair either issue."
    - "This task does not test persistence, localStorage, database, Auth, RLS, external APIs, cross-device sync, or backup/restore."
    - "Formal Phase 3.1 UX Acceptance remains OPEN."

