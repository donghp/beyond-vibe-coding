  executor:
    class: HYBRID
    identifier: "Human Owner operates GAIS; Gemini in the authenticated GAIS session performs the authorized code edit when prompted; ChatGPT prepares the exact prompt and reviews supplied source/Preview evidence. ChatGPT has no direct GAIS account or file-system access."
