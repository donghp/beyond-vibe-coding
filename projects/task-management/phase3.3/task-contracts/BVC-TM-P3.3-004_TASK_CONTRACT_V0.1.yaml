contract_version: "0.1.0"
contract_id: "BVC-TM-TC-004"
revision: 1
status: APPROVED
created_at: "2026-11-11T17:00:00+07:00"

task:
  id: "BVC-TM-P3.3-004"
  title: "PHASE B1 — CREATE AND DISPLAY THE FIRST TASK"
  objective: >-
    Implement one beginner-friendly task creation flow in the existing GAIS
    BVC Task Management app. A learner enters only a task title, submits it,
    sees the task in a visible list, and receives clear validation for an
    empty or whitespace-only title. Tasks remain in the current page's
    in-memory React state only; persistence is explicitly excluded.
  requested_by: "Human Owner / Product Owner"
  parent_task_id: "BVC-TM-P3.3-003"

project:
  project_id: "BVC-TASK-MANAGEMENT"
  repository:
    url: "https://github.com/donghp/beyond-vibe-coding"
    default_branch: "main"
  baseline:
    source_commit: "58ee43cefff59b3e99a48314a322d639652b38fb"
    working_tree_status: CLEAN
    architecture_baseline_refs:
      - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
      - "projects/task-management/design/architecture/v0.1/PHASE3_2_ARCHITECTURE_REVIEW_AND_ACCEPTANCE.md"
      - "projects/task-management/design/ux/v0.1/PHASE3_1_UX_DESIGN_REVIEW_AND_ACCEPTANCE.md"
      - "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
    recovery_point:
      kind: snapshot
      reference: "Owner-supplied GAIS source ZIP bvc-task-management-scaffold-inspection.zip; SHA-256 fd2de957853cccefd5c1c0f5f887bb1ab34fabe34eeaf1bfe86bb982c62c2723. Re-export or compare app/page.tsx immediately before execution."
      verified: true

intent:
  objective: >-
    Replace the blank scaffold placeholder with one minimal, observable
    task-capture interaction for the Beginner learning path.
  rationale: >-
    Phase A is complete and the scaffold has been inspected from the
    Owner-supplied GAIS export. The Human Owner approved the Phase B1 scope.
    The first lesson must demonstrate one useful behavior without mixing
    task creation with persistence, database setup, authentication, or
    advanced application features.
  expected_outcome: >-
    In GAIS Preview, a learner can type a non-empty task title, select Add
    task, and see exactly one new list item. Empty and whitespace-only input
    is rejected with a helpful message. A successful submission clears the
    input. Tasks exist only in page memory and are lost after a page reload.
  business_or_user_value: >-
    Give beginners an immediate first product outcome while teaching the
    difference between in-memory UI state and persistent storage.

risk:
  level: R2
  policy_ref: "projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md — R2 bounded single-component change"
  rationale: >-
    This is one reversible UI/state change in a single page. It handles only
    synthetic task titles in transient browser memory. It does not introduce
    personal-data storage, external services, dependencies, authentication,
    database changes, shared business logic, or production operations.
  impact_factors:
    - other
  reversibility: EASY
  risk_owner: "Product Owner / Human Owner"

scope:
  mode: WRITE
  allowed_changes:
    create: []
    modify:
      - "app/page.tsx"
    delete: []
  forbidden_paths:
    - "package.json"
    - "bun.lock"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    - "next.config.ts"
    - "tsconfig.json"
    - "postcss.config.mjs"
    - "eslint.config.mjs"
    - ".eslintrc.json"
    - ".env.example"
    - "metadata.json"
    - "app/layout.tsx"
    - "app/globals.css"
    - "app/not-found.tsx"
    - "README.md"
  forbidden_path_prefixes:
    - "node_modules/"
    - ".next/"
    - ".github/"
    - "app/api/"
    - "supabase/"
    - "firebase/"
    - "prisma/"
  protected_resource_refs:
    - "The exported GAIS scaffold inventory is factual evidence; do not alter or replace the scaffold toolchain."
    - "Product Definition v0.2.0 is the current product authority."
    - "Phase 3.2 Architecture is accepted design only; no architecture change is authorized."
    - "Formal Phase 3.1 UX Acceptance remains OPEN."
    - "DR-005 first-use storage disclosure remains OPEN and is explicitly outside B1 because B1 introduces no persistence or first-use storage."
    - "DR-014 browser localStorage is ACCEPTED FOR DESIGN only; B1 must not implement it."
  scope_expansion_allowed: false
  scope_expansion_policy: STOP_AND_REQUEST_APPROVAL
  discovery_outside_scope_allowed: true
  stop_if_out_of_scope_change_detected: true

constraints:
  - "Execute only in the existing BVC Task Management GAIS project identified by app id ca589018-617d-4919-bbe2-6b9c588ccd85. Do not create a second app."
  - "Immediately before editing, inspect the current app/page.tsx and compare it with the Owner-supplied scaffold snapshot. If the file or project identity differs materially, stop and report the difference."
  - "Modify exactly one file: app/page.tsx relative to the GAIS project root. No other repository or GAIS file may be created, modified, renamed, moved, or deleted."
  - "Use the existing Next.js App Router and TypeScript/TSX scaffold. Add no package, dependency, lockfile, environment variable, configuration, route, API, service, or external resource."
  - "Use local React component state only for the in-memory task list. Do not use localStorage, sessionStorage, IndexedDB, cookies, browser databases, files, server actions, API calls, or remote persistence."
  - "The task title is the only required field. Do not add due date, priority, project, status selector, notes, checklist, assignment, tags, editing, completion, or deletion."
  - "Trim leading and trailing whitespace before creating a task. Reject empty or whitespace-only titles, create no list item, and show the friendly message: Please enter a task title."
  - "For a successful submission, add exactly one task, clear the input, and clear any previous validation message."
  - "Use a semantic form with an explicitly associated label and a submit button so the learner can submit with Enter as well as mouse or touch."
  - "Show a simple empty state before the first task is added and a clearly readable list after tasks are added."
  - "Keep tasks in insertion order. No duplicate-detection or additional task-management rules are required."
  - "Keep the visual design simple, responsive, and consistent with the existing scaffold's Tailwind utility styling. Do not change global styling foundations."
  - "A page refresh resets the B1 task list. This is expected behavior and must not be hidden or described as persistence."
  - "Do not connect GitHub, Firebase, Gemini APIs, Supabase, databases, Auth, RLS, hosting, analytics, or other external services."
  - "Do not reveal or record secret values, personal data, customer information, or private account details."
  - "Before editing, state the Contract ID, exact allowed file, current page structure, and planned behavior. After editing, report the actual changed-file list and any checks actually run."
  - "If more than app/page.tsx must change, stop and request a new or revised Contract. Do not silently expand scope."
  - "The Human Owner operates the authenticated GAIS account and reviews/accepts the Preview. ChatGPT does not have direct GAIS file-system or account access."
  - "Do not mark B1 complete based on an AI response alone. Human Owner Preview evidence and acceptance are required."

required_context:
  - reference: "practical-labs/bvc-task-management/PROJECT_INSTRUCTIONS_V0.1.md"
    purpose: "Canonical BVC Task Management working instructions copied into the GAIS project."
    authority: CANONICAL
    required: true
  - reference: "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
    purpose: "Title-only quick task capture and Beginner product boundary."
    authority: APPROVED
    required: true
    version_or_commit: "Product Owner-approved v0.2.0."
  - reference: "projects/task-management/phase3.3/GAIS_SCAFFOLD_INSPECTION_REPORT_V0.1.md"
    purpose: "Evidence-backed source inventory and scaffold limitations."
    authority: APPROVED
    required: true
    version_or_commit: "Task #003 report; accepted by Human Owner with known limitations on 2026-11-11."
  - reference: "projects/task-management/phase3.3/GAIS_SCAFFOLD_INVENTORY_V0.1.yaml"
    purpose: "18-file source inventory and declared package/configuration facts."
    authority: APPROVED
    required: true
    version_or_commit: "Source ZIP SHA-256 fd2de957853cccefd5c1c0f5f887bb1ab34fabe34eeaf1bfe86bb982c62c2723."
  - reference: "projects/task-management/phase3.3/task-contracts/BVC-TM-P3.3-003_TASK_CONTRACT_V0.1.yaml"
    purpose: "Predecessor scaffold-inspection Contract; its gate was explicitly closed by the Human Owner."
    authority: APPROVED
    required: true
    version_or_commit: "BVC-TM-TC-003 Revision 1; Owner acceptance with known limitations recorded in this revision's execution record."
  - reference: "practical-labs/bvc-task-management/phase-b/b1-create-your-first-task/README.md"
    purpose: "Learner-facing B1 outcome and verification steps."
    authority: CANONICAL
    required: true
  - reference: "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
    purpose: "Preserve DR statuses; in particular B1 excludes the OPEN DR-005 storage disclosure and does not implement DR-014."
    authority: CANONICAL
    required: true
  - reference: "projects/task-management/design/ux/v0.1/BVC_TASK_MANAGEMENT_INTERACTION_SPECIFICATION_V0.1.md"
    purpose: "Task capture interaction principles; this Contract narrows behavior to title-only in-memory B1."
    authority: REFERENCE
    required: true
  - reference: "projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md"
    purpose: "R2 single-component change controls."
    authority: APPROVED
    required: true
    version_or_commit: "BVC-TM-RISK-001 v0.1.0; known publication-pending header metadata remains outside this task."

dependencies:
