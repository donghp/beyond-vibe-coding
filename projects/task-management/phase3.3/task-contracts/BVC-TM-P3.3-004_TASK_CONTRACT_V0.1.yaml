    - inspect
    - run_analysis
    - modify
    - run_build
    - run_tests
  human_approval:
    required: true
    status: APPROVED
    approver_role: "Human Owner / Product Owner"
    approval_reference: "Explicit Human Owner approval of Contract B1 in the 2026-11-11 ChatGPT conversation."
    rationale: "R2 is a reversible single-page change that uses synthetic task titles in transient browser memory and does not introduce persistent personal data, external services, dependencies, or protected architecture changes."

stopping_conditions:
  - scope_expansion_required
  - protected_resource_detected
  - change_budget_exceeded
  - baseline_or_recovery_point_unverified
  - required_context_missing_or_conflicting
  - authorization_missing_or_revoked
  - verification_failed_or_insufficient
  - unexpected_file_change
  - risk_escalation
  - security_or_data_exposure
  - working_tree_changed_unexpectedly
  - other

retry_policy:
