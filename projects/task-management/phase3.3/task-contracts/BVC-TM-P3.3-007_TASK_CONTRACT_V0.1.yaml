intent:
  expected_outcome: >-
    The Beginner app shows the canonical My Day sections in the approved
    order, assigns each active task to at most one section, applies the
    selected IANA timezone to all calendar-date calculations, and preserves
    existing B2 tasks through a validated, recoverable workspace migration.
  learning_outcomes:
    - "Understand the distinction between a date-only due date and a timestamp."
    - "Understand how a selected IANA timezone determines the local calendar day."
    - "Observe deterministic task placement and no-duplicate behavior."
    - "Understand how a versioned browser workspace is validated and migrated."
  non_goals:
    - "Full My Tasks search, filters, Kanban, task editing or deletion."
    - "Full priority management, project management, Starter Kits or backup/restore."
    - "Cloud synchronization, database, Supabase, Auth, RLS, APIs or external services."

risk:
  level: R4
  policy_ref: "projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md"
  rationale: >-
    The task migrates and changes handling of personal workspace task data
    stored in the learner's browser. The project Risk Policy classifies work
    affecting personal data as R4 even though the implementation is limited
    to one application file and does not use a database. Cross-section task
    placement and timezone business rules are additional impacts; file count
    does not lower the risk category.
  impact_factors:
    - "personal_data"
  reversibility: "LIMITED"
  reversibility_note: >-
    The unchanged v1 key is the original pre-migration checkpoint only. It is
    not a rolling backup and does not include tasks or edits created after v2
    becomes active. A code downgrade or post-migration rollback requires a
    separate Owner-approved recovery procedure that preserves the current v2
    payload and proves the v1-compatible projection before any overwrite.
  minimum_verification: "EVIDENCE_LEVEL_3 for migration/data integrity; EVIDENCE_LEVEL_4 for actual Preview behavior and Owner-observed user outcomes."
  domain_review_required: >-
    Human Owner must designate and obtain approval from the relevant Data
    Privacy / Security domain reviewer before any execution involving the
    learner's persisted personal workspace data.

