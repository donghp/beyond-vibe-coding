task:
  id: "BVC-TM-P3.3-007"
  title: "PHASE C1 — MY DAY: IMPLEMENT DATE-AWARE DAILY VIEW"
  objective: >-
    Implement the approved C1 — My Day behavior in the existing Beginner GAIS
    application. Preserve all accepted B2 workspace records, introduce
    validated date/focus fields and the selected IANA timezone, migrate the
    version-1 browser workspace safely, and render Overdue, Due Today,
    Today's Focus and Upcoming without duplicate task rows. This draft
    Contract does not authorize execution.
  parent_task_id: "BVC-TM-P3.3-006"
  requested_by: "AI-prepared implementation proposal for Human Owner review on 2026-11-24"
  risk_level: R4
  risk_rationale: >-
    My Day changes shared task-state handling, date calculations, workspace
    migration and cross-section business rules. The project risk policy
    classifies cross-component business logic as R3. Persisted-data behavior
    requires Evidence Level 3 migration and recovery evidence. No database,
    Auth, RLS, identity or external-service change is included.

