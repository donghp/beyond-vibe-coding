    delete: []
  change_budget:
    max_changed_files: 1
    max_created_files: 0
    max_modified_files: 1
    max_deleted_files: 0
    max_binary_files: 0
    max_total_diff_lines: 500
    allow_dependency_changes: false
    allow_lockfile_changes: false
    allow_config_changes: false
    allow_route_changes: false
    allow_database_schema_changes: false
    allow_authentication_changes: false
    allow_external_services: false
    allow_architecture_changes: false
  scope_expansion_allowed: false
  scope_expansion_policy: "STOP_AND_REQUEST_A_NEW_APPROVED_CONTRACT"
  stop_if:
    - "The live GAIS app ID does not match the target app ID."
    - "The live app/page.tsx differs materially from the last Owner-reported source and cannot be reconciled safely."
