contract_version: "0.1.0"
contract_id: "BVC-TM-TC-001"
revision: 1
status: PROPOSED
created_at: "2026-11-05T09:30:00+07:00"

task:
  id: "BVC-TM-P3.3-001"
  title: "BEGINNER IMPLEMENTATION READINESS — STEP-BY-STEP LEARNING BLUEPRINT"
  objective: "Prepare a beginner-first, step-by-step learning blueprint and a bounded Context Pack for building BVC Task Management from zero programming knowledge, without implementing application code."

project:
  project_id: "BVC-TASK-MANAGEMENT"
  repository:
    url: "https://github.com/donghp/beyond-vibe-coding"
    default_branch: "main"
  baseline:
    source_commit: "d4c392a845055e9d1c494a730aac0486a44db73e"
    working_tree_status: CLEAN
    architecture_baseline_refs:
      - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
      - "projects/task-management/design/architecture/v0.1/PHASE3_2_ARCHITECTURE_REVIEW_AND_ACCEPTANCE.md"
      - "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
      - "projects/task-management/design/ux/v0.1/PHASE3_1_UX_DESIGN_REVIEW_AND_ACCEPTANCE.md"
    recovery_point:
      kind: git_commit
      reference: "main@d4c392a845055e9d1c494a730aac0486a44db73e"
      verified: true

intent:
  objective: "Define the smallest safe preparation task that turns the approved BVC Task Management product and design baseline into a practical learning journey that an absolute beginner can follow, one step at a time."
  rationale: "The product is defined and its Phase 3.2 architecture design is accepted, but the GAIS application has not yet been created or run with evidence. Before implementation, the team must define the Beginner journey, its first verifiable outcome, the required context, and the decisions that must remain open or be resolved."
  expected_outcome: "Two reviewed artifacts: a Beginner Implementation Readiness document and a machine-readable Beginner Context Pack. The artifacts describe a learner journey from zero programming knowledge and prepare the next bounded task, GAIS Scaffold Inspection."
  business_or_user_value: "A reader who has never programmed can follow explicit actions, understand what each action does, see the expected result, and verify progress without needing to understand engineering governance terminology."

risk:
  level: R1
  policy_ref: "PROPOSED — projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md (policy branch: governance/task-management-risk-policy-v0.1). R1 is proposed for this documentation/readiness scope. The policy is not effective until Product Owner approval and controlled merge to main; this dependency blocks execution."
  rationale: "The proposed work creates only two documentation/configuration artifacts on a separate branch. It does not modify application code, dependencies, database schema, authentication, financial logic, architecture baselines, or production systems. The R1 label is provisional because the repository has no approved project-specific R0-R5 mapping."
  impact_factors: []
  reversibility: EASY
  risk_owner: "Product Owner / Human Owner"

scope:
  mode: WRITE
  allowed_changes:
    create:
      - "projects/task-management/phase3.3/BEGINNER_IMPLEMENTATION_READINESS_V0.1.md"
      - "projects/task-management/phase3.3/BEGINNER_CONTEXT_PACK_V0.1.yaml"
    modify: []
    delete: []
  forbidden_paths:
    - "projects/task-management/README.md"
    - "projects/task-management/product/BVC_TASK_MANAGEMENT_PRODUCT_DEFINITION_V0.2.0.md"
    - "projects/task-management/governance/PHASE3_PRODUCT_UX_DECISION_REGISTER_V0.1.md"
    - "projects/task-management/design/ux/v0.1/PHASE3_1_UX_DESIGN_REVIEW_AND_ACCEPTANCE.md"
    - "projects/task-management/design/architecture/v0.1/PHASE3_2_ARCHITECTURE_REVIEW_AND_ACCEPTANCE.md"
    - "specifications/v0.1/task-contract.md"
    - "specifications/v0.1/task-contract.schema.json"
    - "scripts/validate_task_contracts.py"
  forbidden_path_prefixes:
    - "application/"
    - "starter-kits/"
    - "examples/"
    - "specifications/"
    - "scripts/"
    - "tests/"
    - ".github/"
    - "projects/task-management/product/"
    - "projects/task-management/design/"
    - "projects/task-management/governance/"
  protected_resource_refs:
    - "Product Definition v0.2.0 — current Product Owner-approved product baseline"
    - "Phase 3.2 Architecture Review & Acceptance — accepted design baseline"
    - "Phase 3.1 UX Review & Acceptance — formal acceptance remains OPEN"
    - "Phase 3 Product / UX Decision Register — DR-001 through DR-019"
    - "Five Phase 2 Core Specifications and their schemas, examples, validators, tests, and workflow"
  scope_expansion_allowed: false
  scope_expansion_policy: STOP_AND_REQUEST_APPROVAL
  discovery_outside_scope_allowed: true
  stop_if_out_of_scope_change_detected: true

constraints:
  - "Do not create, modify, or delete application source code, generated application files, starter-kit assets, or runtime configuration."
  - "Do not create a GAIS application, run GAIS, provision Supabase, create a database, configure Auth/RLS, configure hosting, deploy, or claim runtime verification."
  - "Create exactly the two files listed in scope.allowed_changes.create; do not modify existing product, UX, architecture, governance, specification, validator, test, or workflow files."
  - "Treat Product Definition v0.2.0 as the current product authority and v0.1.0 as historical evidence; do not rewrite the historical baseline."
  - "Treat Phase 3.2 Architecture as accepted design only; do not infer implementation or runtime acceptance."
  - "Formal Phase 3.1 UX Acceptance remains OPEN. Do not claim PASS or close it in this task."
  - "Do not convert any proposed default in DR-001 through DR-019 into an approved decision. Record the relevant decision IDs and their dependency gates."
  - "DR-014 is ACCEPTED FOR DESIGN only; browser localStorage persistence still requires runtime verification in a later task."
  - "DR-005 remains OPEN and must be identified as a prerequisite for final first-use disclosure timing and copy before the dependent onboarding implementation."
  - "The first product slice is limited to open the app, create a task using a title only, save it, reload the same browser profile, and verify that the task remains."
  - "Do not include Projects, My Day date logic, Starter Kit application, delete interactions, Backup/Restore, Supabase, Authentication, RLS, GitHub workflows, VS Code, Localhost, or hosting implementation in the first vertical slice."
  - "Write all reader-facing instructions for someone with zero programming knowledge. Use Step 1, Step 2, Step 3 numbering; each step must have one action, a plain-language reason, exact click/type guidance when verified, expected result, verification, and recovery guidance."
  - "Do not invent current Google AI Studio interface labels, menus, scaffold files, framework, package manager, commands, or build outputs. Mark them for direct inspection in the later GAIS Scaffold Inspection task."
  - "Keep internal BVC Task Contract controls separate from the learner-facing beginner steps. The reader must not need to understand Task Contracts before starting the book exercise."
  - "Do not use real personal, customer, or confidential data in sample instructions; use synthetic examples."
  - "Do not choose an AI model or claim quota availability as verified unless an observed exact model label and current availability evidence are recorded in the task-specific plan."

