b2_scope:
  outcome: >-
    Persist the Beginner task workspace in the current browser profile and load saved tasks
    when the same app is opened again in the same browser profile and origin.
  storage:
    provider: localStorage
    key: bvc-task-management:workspace:v1
    format: bvc-task-management-workspace
    formatVersion: 1
    sourceMode: browser
    envelope_reference: BVC-TM-TC-005 Revision 1
  disclosure:
    decision: DR-005
    placement: Compact inline notice at the top of the workspace before first persistence
    acknowledgement: Got it — continue
    copy: >-
      Where your tasks are stored

      In Beginner mode, your tasks are stored in this browser on this device. They do not automatically sync to other browsers or devices.

      Clearing this site's browser data may delete your tasks.

      Browser storage is not a separate backup. You will learn to export a JSON backup in a later lesson.

      Do not enter passwords, API keys, or sensitive information in this learning app.
  data_integrity:
    - Load and validate before enabling writes
    - Do not write an empty default workspace on mount
    - Preserve malformed/unsupported stored data; never silently clear or overwrite
    - Attempt one complete workspace write before committing the new React state or clearing input
    - If storage fails, preserve prior task list/input and report the error truthfully
out_of_scope:
  - Supabase, PostgreSQL, Auth, RLS, Firebase and any remote API
  - Cloud sync, cross-tab sync or cross-device sync
  - Projects, Checklists, task status/priority/due dates, edit/delete/complete
  - Backup export/import/restore
  - More navigation or a Settings & Backup page
  - New dependencies, lockfiles, configuration, routes or any file other than app/page.tsx
learner_delivery_rule: >-
  Do not create or copy design/, governance/, task-contracts/, continuity/ or repository
  directories inside GAIS. The learner uses the lesson, this Context Pack, the approved
  Contract and the canonical Prompt. GitHub links remain the source of truth.
