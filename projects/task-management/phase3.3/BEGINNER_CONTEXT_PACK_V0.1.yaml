authority_and_precedence:
  order:
    - "Approved Task Contract defines the exact authorized task scope and operations."
    - "Product Definition v0.2.0 is the current product authority."
    - "Phase 3.2 Architecture Review & Acceptance is the accepted design baseline only."
    - "Phase 3 Product / UX Decision Register is authoritative for DR decision status and dependencies."
    - "Phase 3.1 UX Review & Acceptance remains OPEN and is an independent gate."
    - "This Context Pack is a bounded navigation/context aid and cannot override any source above."
  rules:
    - "A proposed default is not an approved Product Owner decision."
    - "A design acceptance is not implementation or runtime verification."
    - "Contract approval authorizes the defined task; it does not automatically accept the deliverables."
    - "Any required scope expansion must stop and return for a new or revised Task Contract."

task_contract:
  contract_id: "BVC-TM-TC-001"
  revision: 3
  status: "APPROVED"
  task_id: "BVC-TM-P3.3-001"
  objective: >-
    Prepare a beginner-first, step-by-step learning blueprint and a bounded
    Context Pack for building BVC Task Management from zero programming
    knowledge, without implementing application code.
  risk:
    level: "R1"
    policy_path: "projects/task-management/governance/BVC_TASK_MANAGEMENT_RISK_POLICY_V0.1.md"
    policy_id: "BVC-TM-RISK-001"
    policy_version: "0.1.0"
    policy_status: "PRODUCT_OWNER_APPROVED_AND_PUBLISHED_ON_MAIN"
  authorized_operations:
    create:
      - "projects/task-management/phase3.3/BEGINNER_IMPLEMENTATION_READINESS_V0.1.md"
      - "projects/task-management/phase3.3/BEGINNER_CONTEXT_PACK_V0.1.yaml"
    modify: []
    delete: []
  change_budget:
    max_changed_files: 2
    max_created_files: 2
    max_modified_files: 0
    max_deleted_files: 0
    max_total_diff_lines: 1600
    max_binary_files: 0
  scope_expansion:
    allowed: false
    policy: "STOP_AND_REQUEST_APPROVAL"
  execution_constraints:
    - "Create exactly the two authorized files and do not modify or delete existing files."
    - "Do not create, modify, or delete application source code, generated app files, starter-kit assets, or runtime configuration."
    - "Do not create or run a GAIS application, inspect a live GAIS scaffold, provision Supabase, create a database, configure Auth/RLS, configure hosting, or deploy."
    - "Do not change Product, UX, Architecture, Governance, Decision Register, Core Specifications, schema, validator, tests, or workflows."
    - "Do not convert any proposed default in DR-001 through DR-019 into an approved decision."
    - "Keep DR-005 OPEN and identify it as a prerequisite for the dependent first-use storage disclosure implementation."
    - "Keep DR-014 at ACCEPTED FOR DESIGN only; runtime persistence still requires verification."
    - "Keep the first slice limited to open the app, create a task with title only, save, reload/reopen the same browser profile, and verify the task remains."
    - "Do not include Projects, My Day date logic, Starter Kit application, delete interactions, Backup/Restore, Supabase, Auth, RLS, GitHub workflows, VS Code, Localhost, or hosting implementation in the first slice."
    - "Use zero-programming-knowledge learner instructions with numbered steps and one action per step."
    - "Do not invent GAIS interface labels, scaffold files, framework, package manager, commands, or build outputs."
    - "Keep engineering Task Contract controls separate from the learner-facing Beginner lesson."
    - "Use synthetic sample data; do not use real personal, customer, or confidential information."

