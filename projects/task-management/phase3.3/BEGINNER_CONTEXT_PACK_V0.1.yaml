decision_constraints:
  - id: "DR-001"
    decision: "Upcoming horizon in My Day"
    status: "OPEN"
    dependency: "Resolve before implementing Upcoming date filtering; My Day is outside the first slice."
  - id: "DR-002"
    decision: "Today's Focus lifetime/reset"
    status: "OPEN"
    dependency: "Resolve before implementing Focus persistence/reset; exclude from the first slice."
  - id: "DR-003"
    decision: "Project removal behavior"
    status: "OPEN"
    dependency: "Resolve before implementing project removal; Projects are outside the first slice."
  - id: "DR-004"
    decision: "Reapplying a Starter Kit"
    status: "OPEN"
    dependency: "Resolve before repeat-application/merge behavior; Starter Kits are outside the first slice."
  - id: "DR-005"
    decision: "Timing and exact copy of first-use storage disclosure"
    status: "OPEN"
    dependency: "Resolve before implementing the dependent Beginner onboarding disclosure; do not freeze copy or placement here."
  - id: "DR-006"
    decision: "Restore conflict and replacement semantics"
    status: "OPEN"
    dependency: "Resolve before implementing Beginner restore or workspace replacement; restore is outside the first slice."
  - id: "DR-007"
    decision: "Task deletion interaction"
    status: "OPEN"
    dependency: "Resolve before implementing task deletion; deletion is outside the first slice."
  - id: "DR-008"
    decision: "Initial visual theme"
    status: "OPEN"
    dependency: "Do not treat the proposed theme as approved; resolve before freezing visual theme tokens."
  - id: "DR-009"
    decision: "Primary color/hue"
    status: "OPEN"
    dependency: "Do not treat the proposed hue as approved; resolve before freezing color tokens."
  - id: "DR-010"
    decision: "Minimum browser support matrix"
    status: "OPEN"
    dependency: "Resolve before final browser/device acceptance."
  - id: "DR-011"
    decision: "Font packaging"
    status: "OPEN"
    dependency: "Resolve before bundling or freezing a packaged font asset."
  - id: "DR-012"
    decision: "Icon family"
    status: "OPEN"
    dependency: "Resolve before final icon-family implementation/freeze."
  - id: "DR-013"
    decision: "Final contrast audit"
    status: "VERIFICATION_REQUIRED"
    dependency: "Requires rendered UI and measured foreground/background/state contrast evidence; not part of this documentation task."
  - id: "DR-014"
    decision: "Beginner browser persistence"
    status: "ACCEPTED_FOR_DESIGN_RUNTIME_VERIFICATION_REQUIRED"
    dependency: "Use versioned browser localStorage as the design direction; verify runtime behavior in a later implementation task."
  - id: "DR-015"
    decision: "Starter Kit definition packaging"
    status: "OPEN"
    dependency: "Do not choose the Starter Kit definition source or format before this decision is resolved."
  - id: "DR-016"
    decision: "Beginner-to-Supabase import semantics"
    status: "OPEN"
    dependency: "Resolve before Intermediate migration/import implementation."
  - id: "DR-017"
    decision: "Timezone source and editing"
    status: "OPEN"
    dependency: "Resolve before date-boundary or Supabase timezone implementation."
  - id: "DR-018"
    decision: "Advanced local Supabase stack"
    status: "OPEN"
    dependency: "Not a Beginner prerequisite; resolve before writing Advanced local-environment instructions."
  - id: "DR-019"
    decision: "Supabase Auth method and recovery flow"
    status: "OPEN"
    dependency: "Resolve before the first dependent Intermediate Auth implementation task."

architecture_decision_crosswalk:
  - id: "ODEC-001"
    decision: "Hosting provider for an individual deployment"
    status: "RESOLVED_PROVIDER_NEUTRAL"
    dependency: "No mandatory vendor; select a compatible example when preparing the practical lesson."
  - id: "ODEC-002"
    decision: "Database reference for learning"
    status: "RESOLVED_SUPABASE_FREE_REFERENCE_ENVIRONMENT"
    dependency: "Supabase Free is the reference database learning environment; check current terms/quotas when preparing live instructions."
  - id: "ODEC-003"
    decision: "Beginner browser store"
    status: "ACCEPTED_FOR_DESIGN_RUNTIME_VALIDATION_REQUIRED"
    dependency: "Crosswalk to DR-014; runtime persistence must still be tested."
  - id: "ODEC-004"
    decision: "Frontend build tool"
    status: "DEFERRED_GAIS_SCAFFOLD_INSPECTION"
    dependency: "Inspect the actual GAIS scaffold before selecting framework/build configuration."
  - id: "ODEC-005"
    decision: "Authentication method"
    status: "DEFERRED_PENDING_PRODUCT_OWNER_DECISION"
    dependency: "Crosswalk to DR-019; resolve before Intermediate Auth implementation."
  - id: "ODEC-006"
    decision: "Local Supabase stack"
    status: "OPTIONAL_FOR_PHASE_3_2; ADVANCED_CURRICULUM_SCOPE_OPEN_UNDER_DR_018"
    dependency: "Do not make a local database stack a Beginner prerequisite."
  - id: "ODEC-007"
    decision: "Product Definition baseline transition"
    status: "RESOLVED_PRODUCT_DEFINITION_V0_2_0_CURRENT_ON_MAIN"
    dependency: "Use v0.2.0 as current product authority; retain v0.1.0 as historical evidence."
  - id: "ODEC-008"
    decision: "Exact hosting service used in practical screenshots"
    status: "DEFERRED_UNTIL_PRACTICAL_LESSON_PREPARATION"
    dependency: "Keep hosting provider-neutral; a practical example is not a project-wide mandate."

decisions_and_requirements:
  first_vertical_slice:
