
name: Validate BVC Core Specifications

on:
  push:
    branches: [main]
    paths:
      - "specifications/v0.1/**"
      - "scripts/validate_task_contracts.py"
      - "scripts/validate_core_specifications.py"
      - "tests/test_task_contracts.py"
      - "tests/test_core_specifications.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-task-contracts.yml"

  pull_request:
    branches: [main]
    paths:
      - "specifications/v0.1/**"
      - "scripts/validate_task_contracts.py"
      - "scripts/validate_core_specifications.py"
      - "tests/test_task_contracts.py"
      - "tests/test_core_specifications.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-task-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas, semantics, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Task Contract examples
        run: python scripts/validate_task_contracts.py

      - name: Validate all Core Specifications
        run: python scripts/validate_core_specifications.py

      - name: Run all automated tests
        run: python -m unittest discover -s tests -v
