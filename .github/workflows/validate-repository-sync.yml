name: Validate Repository Synchronization Completeness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "practical-labs/**"
      - "specifications/**"
      - "templates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"
      - "requirements-dev.txt"

permissions:
  contents: read

concurrency:
  group: repository-sync-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-sync:
    name: Repository sync completeness
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run repository synchronization unit tests
        run: python -m unittest discover -s tests -p "test_repository_sync.py" -v

      - name: Validate changed-path synchronization package
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
            if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
            fi
          fi
          python scripts/validate_repository_sync.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
