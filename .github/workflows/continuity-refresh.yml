name: BVC Event-Driven Continuity Refresh

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "specifications/**"
      - "templates/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"
      - "requirements-dev.txt"
      - "practical-labs/**"

  pull_request:
    branches: [main]
    paths:
      - "docs/continuity/**"
      - "scripts/update_continuity_state.py"
      - "tests/test_continuity_updater.py"
      - ".github/workflows/continuity-refresh.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bvc-continuity-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run continuity updater tests
        run: python -m unittest discover -s tests -p "test_continuity_updater.py" -v

      - name: Validate continuity state YAML
        run: |
          python -c "import yaml; yaml.safe_load(open('docs/continuity/CURRENT_STATE.yaml', encoding='utf-8')); print('PASS: CURRENT_STATE.yaml parsed')"

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run updater unit tests
        run: python -m unittest discover -s tests -p "test_continuity_updater.py" -v

      - name: Prepare reserved automation branch
        env:
          BRANCH_NAME: automation/continuity-refresh
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote --heads origin "$BRANCH_NAME" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ]; then
            git fetch origin "$REMOTE_SHA"
            NON_BOT_COMMITS="$(git log --format='%H %ae %s' "$REMOTE_SHA" --not "$GITHUB_SHA" | awk '$2 != "41898282+github-actions[bot]@users.noreply.github.com" { print }')"
            if [ -n "$NON_BOT_COMMITS" ]; then
              echo "ERROR: reserved continuity branch contains non-bot commits; refusing to overwrite."
              echo "$NON_BOT_COMMITS"
              exit 1
            fi
            echo "EXPECTED_REMOTE_SHA=$REMOTE_SHA" >> "$GITHUB_ENV"
          else
            echo "EXPECTED_REMOTE_SHA=" >> "$GITHUB_ENV"
          fi
          git switch --create "$BRANCH_NAME" "$GITHUB_SHA"

      - name: Create machine snapshot update
        id: update
        run: >-
          python scripts/update_continuity_state.py
          --event-path "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"
          --sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"

      - name: Commit and push machine snapshot
        if: steps.update.outputs.changed == 'true'
        env:
          BRANCH_NAME: automation/continuity-refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/continuity/CURRENT_STATE.yaml
          if git diff --cached --quiet; then
            echo "No machine snapshot diff; nothing to publish."
            exit 0
          fi
          git commit -m "chore(continuity): refresh machine-observed state"
          if [ -n "$EXPECTED_REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/${BRANCH_NAME}:${EXPECTED_REMOTE_SHA}" origin "$BRANCH_NAME"
          else
            git push origin "$BRANCH_NAME"
          fi

      - name: Open or update continuity review PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: automation/continuity-refresh
        run: |
          set -euo pipefail
          TITLE="chore(continuity): refresh machine-observed state"
          BODY_FILE="$RUNNER_TEMP/continuity-pr-body.md"
          cat > "$BODY_FILE" <<'BODY'
          ## Automated continuity snapshot refresh

          This PR updates only `docs/continuity/CURRENT_STATE.yaml` machine-observed metadata from a material push to `main`.

          - Records the source `main` SHA, commit range and changed paths.
          - Does not rewrite project facts, product/architecture baselines, decisions, task status, completion, acceptance or risk.
          - Sets semantic review to pending; AI review and Human Owner review remain required.
          - Does not write directly to `main`.

          Review the changed paths and update the relevant canonical project records separately when authorized. Human Owner review and merge are required.
          BODY
          PR_NUMBER="$(gh pr list --state open --base main --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH_NAME" --title "$TITLE" --body-file "$BODY_FILE"
          else
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$BODY_FILE"
          fi
