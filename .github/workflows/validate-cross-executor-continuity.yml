name: Validate Cross-Executor Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md"
      - "docs/continuity/WORKER_HANDOFF.schema.json"
      - "docs/continuity/WORKER_HANDOFF.template.yaml"
      - "docs/continuity/CROSS_EXECUTOR_RECOVERY_TEST_PLAN.md"
      - "docs/continuity/BOOTSTRAP.md"
      - "docs/continuity/CONTINUITY_PROTOCOL.md"
      - "docs/continuity/HANDOFF_TEMPLATE.md"
      - "docs/continuity/BVC_NEXT_CHAT_PROMPT.md"
      - "docs/continuity/GITHUB_REPOSITORY_VERIFICATION.md"
      - "docs/continuity/README.md"
      - "docs/continuity/SOURCE_MANIFEST.csv"
      - "docs/continuity/HANDOFF_LOG.md"
      - "scripts/validate_worker_handoff.py"
      - "tests/test_worker_handoff.py"
      - ".github/workflows/validate-cross-executor-continuity.yml"
  push:
    branches: [main]
    paths:
      - "docs/continuity/CROSS_EXECUTOR_CONTINUITY.md"
      - "docs/continuity/WORKER_HANDOFF.schema.json"
      - "docs/continuity/WORKER_HANDOFF.template.yaml"
      - "docs/continuity/CROSS_EXECUTOR_RECOVERY_TEST_PLAN.md"
      - "docs/continuity/BOOTSTRAP.md"
      - "docs/continuity/CONTINUITY_PROTOCOL.md"
      - "docs/continuity/HANDOFF_TEMPLATE.md"
      - "docs/continuity/BVC_NEXT_CHAT_PROMPT.md"
      - "docs/continuity/GITHUB_REPOSITORY_VERIFICATION.md"
      - "docs/continuity/README.md"
      - "docs/continuity/SOURCE_MANIFEST.csv"
      - "docs/continuity/HANDOFF_LOG.md"
      - "scripts/validate_worker_handoff.py"
      - "tests/test_worker_handoff.py"
      - ".github/workflows/validate-cross-executor-continuity.yml"

permissions:
  contents: read

concurrency:
  group: cross-executor-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install existing validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate the example handoff
        run: python scripts/validate_worker_handoff.py --handoff docs/continuity/WORKER_HANDOFF.template.yaml

      - name: Run worker handoff unit tests
        run: python -m unittest tests.test_worker_handoff -v
