<text x="800" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="bold" fill="#12325c">Stage 3 · Server-Side Security Enforcement</text><text x="800" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#385e82">The backend is the final authority for sensitive actions</text>
<rect x="70" y="295" width="1460" height="480" rx="30" fill="#ffffff" stroke="#c8e3f4" stroke-width="3"/>
<rect x="105" y="335" width="1390" height="68" rx="18" fill="#eef7ff"/><circle cx="150" cy="369" r="24" fill="#d28a10"/><text x="150" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">1</text><text x="205" y="363" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12325c">1 · Receive & validate</text><text x="205" y="387" font-family="Arial,sans-serif" font-size="19" fill="#375d7d">Schema, request limits and protocol checks</text><rect x="105" y="419" width="1390" height="68" rx="18" fill="#effaf2"/><circle cx="150" cy="453" r="24" fill="#d28a10"/><text x="150" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">2</text><text x="205" y="447" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12325c">2 · Verify evidence</text><text x="205" y="471" font-family="Arial,sans-serif" font-size="19" fill="#375d7d">Integrity token, freshness, request binding and replay controls</text><rect x="105" y="503" width="1390" height="68" rx="18" fill="#eef7ff"/><circle cx="150" cy="537" r="24" fill="#d28a10"/><text x="150" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">3</text><text x="205" y="531" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12325c">3 · Authenticate</text><text x="205" y="555" font-family="Arial,sans-serif" font-size="19" fill="#375d7d">Validate identity and session</text><rect x="105" y="587" width="1390" height="68" rx="18" fill="#effaf2"/><circle cx="150" cy="621" r="24" fill="#d28a10"/><text x="150" y="629" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">4</text><text x="205" y="615" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#12325c">4 · Authorize & enforce</text><text x="205" y="639" font-family="Arial,sans-serif" font-size="19" fill="#375d7d">Ownership, permissions, workflow, limits and atomic state change</text>
<rect x="70" y="800" width="1460" height="66" rx="24" fill="#d28a10"/><text x="800" y="842" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff">The client requests. The server independently decides.</text>
